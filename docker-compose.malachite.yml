version: '3.8'

networks:
  malachite-bft:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.22.0.0/16

services:
  # Validator Node 1 (Genesis)
  validator-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: malachite-validator-1
    hostname: validator-1
    networks:
      malachite-bft:
        ipv4_address: 172.22.0.10
    ports:
      - "8080:8080"   # REST API
      - "26656:26656" # P2P
      - "9090:9090"   # Consensus
    environment:
      - NODE_ID=validator-1
      - NODE_TYPE=validator
      - IS_GENESIS_VALIDATOR=true
      - VALIDATOR_ADDRESS=0x0000000000000000000000000000000000000001
      - CONSENSUS_ALGORITHM=malachite-bft
      - BLOCK_TIME_MS=5000
      - TIMEOUT_PROPOSE_MS=3000
      - TIMEOUT_PREVOTE_MS=1000
      - TIMEOUT_PRECOMMIT_MS=1000
      - TIMEOUT_COMMIT_MS=5000
      - MAX_BLOCK_SIZE=1048576
      - MAX_TRANSACTIONS_PER_BLOCK=1000
      - VALIDATOR_SET_SIZE=3
      - PEER_NODES=validator-2@172.22.0.11:26656,validator-3@172.22.0.12:26656
    volumes:
      - validator1-data:/opt/multivm/data
      - ./docker/config/validator1.toml:/opt/multivm/config/node.toml:ro
    command: ["/opt/multivm/bin/multivm", "--config", "/opt/multivm/config/node.toml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Validator Node 2
  validator-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: malachite-validator-2
    hostname: validator-2
    networks:
      malachite-bft:
        ipv4_address: 172.22.0.11
    ports:
      - "8081:8080"   # REST API
      - "26657:26656" # P2P
      - "9091:9090"   # Consensus
    environment:
      - NODE_ID=validator-2
      - NODE_TYPE=validator
      - IS_GENESIS_VALIDATOR=false
      - VALIDATOR_ADDRESS=0x0000000000000000000000000000000000000002
      - CONSENSUS_ALGORITHM=malachite-bft
      - BLOCK_TIME_MS=5000
      - TIMEOUT_PROPOSE_MS=3000
      - TIMEOUT_PREVOTE_MS=1000
      - TIMEOUT_PRECOMMIT_MS=1000
      - TIMEOUT_COMMIT_MS=5000
      - MAX_BLOCK_SIZE=1048576
      - MAX_TRANSACTIONS_PER_BLOCK=1000
      - VALIDATOR_SET_SIZE=3
      - PEER_NODES=validator-1@172.22.0.10:26656,validator-3@172.22.0.12:26656
    volumes:
      - validator2-data:/opt/multivm/data
      - ./docker/config/validator2.toml:/opt/multivm/config/node.toml:ro
    depends_on:
      - validator-1
    command: ["/opt/multivm/bin/multivm", "--config", "/opt/multivm/config/node.toml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Validator Node 3
  validator-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: malachite-validator-3
    hostname: validator-3
    networks:
      malachite-bft:
        ipv4_address: 172.22.0.12
    ports:
      - "8082:8080"   # REST API
      - "26658:26656" # P2P
      - "9092:9090"   # Consensus
    environment:
      - NODE_ID=validator-3
      - NODE_TYPE=validator
      - IS_GENESIS_VALIDATOR=false
      - VALIDATOR_ADDRESS=0x0000000000000000000000000000000000000003
      - CONSENSUS_ALGORITHM=malachite-bft
      - BLOCK_TIME_MS=5000
      - TIMEOUT_PROPOSE_MS=3000
      - TIMEOUT_PREVOTE_MS=1000
      - TIMEOUT_PRECOMMIT_MS=1000
      - TIMEOUT_COMMIT_MS=5000
      - MAX_BLOCK_SIZE=1048576
      - MAX_TRANSACTIONS_PER_BLOCK=1000
      - VALIDATOR_SET_SIZE=3
      - PEER_NODES=validator-1@172.22.0.10:26656,validator-2@172.22.0.11:26656
    volumes:
      - validator3-data:/opt/multivm/data
      - ./docker/config/validator3.toml:/opt/multivm/config/node.toml:ro
    depends_on:
      - validator-1
      - validator-2
    command: ["/opt/multivm/bin/multivm", "--config", "/opt/multivm/config/node.toml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Consensus Monitor and Dashboard
  consensus-monitor:
    image: ubuntu:22.04
    container_name: malachite-monitor
    hostname: monitor
    networks:
      malachite-bft:
        ipv4_address: 172.22.0.100
    ports:
      - "3200:3000"   # Monitor dashboard
    environment:
      - VALIDATOR_NODES=172.22.0.10,172.22.0.11,172.22.0.12
      - CONSENSUS_TYPE=malachite-bft
    depends_on:
      - validator-1
      - validator-2
      - validator-3
    command: >
      bash -c "
        apt-get update && apt-get install -y curl jq &&
        echo 'Starting Malachite BFT Consensus Monitor...' &&
        
        # Wait for validators to be ready
        sleep 30 &&
        
        # Create monitoring dashboard
        cat > /tmp/dashboard.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
            <title>Malachite BFT Consensus Monitor</title>
            <meta http-equiv=\"refresh\" content=\"10\">
            <style>
                body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
                .container { max-width: 1400px; margin: 0 auto; }
                .header { background: #1a237e; color: white; padding: 20px; text-align: center; border-radius: 8px; }
                .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin: 20px 0; }
                .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
                .status-healthy { color: #4caf50; font-weight: bold; }
                .status-unhealthy { color: #f44336; font-weight: bold; }
                .metric { display: flex; justify-content: space-between; margin: 10px 0; padding: 5px 0; border-bottom: 1px solid #eee; }
                .consensus-info { background: #e8f5e8; padding: 15px; border-radius: 5px; margin: 10px 0; }
                .validator-card { border-left: 4px solid #2196f3; }
            </style>
        </head>
        <body>
            <div class=\"container\">
                <div class=\"header\">
                    <h1>🔗 Malachite BFT Consensus Network</h1>
                    <p>Real-time monitoring of Byzantine Fault Tolerant consensus</p>
                    <p><strong>Algorithm:</strong> Malachite BFT | <strong>Validators:</strong> 3 | <strong>Byzantine Tolerance:</strong> f=1</p>
                </div>
                
                <div class=\"consensus-info\">
                    <h3>🏛️ Consensus Information</h3>
                    <p><strong>Malachite BFT:</strong> Production-ready Byzantine Fault Tolerant consensus from Informal Systems</p>
                    <p><strong>Safety:</strong> Guaranteed even with up to 1 Byzantine validator (f < n/3)</p>
                    <p><strong>Liveness:</strong> Guaranteed with network synchrony and non-Byzantine majority</p>
                    <p><strong>Block Time:</strong> 5 seconds | <strong>Timeouts:</strong> Propose(3s), Prevote(1s), Precommit(1s), Commit(5s)</p>
                </div>
                
                <div class=\"grid\">
                    <div class=\"card validator-card\">
                        <h3>📊 Network Overview</h3>
                        <div class=\"metric\"><span>Total Validators:</span><span>3</span></div>
                        <div class=\"metric\"><span>Byzantine Threshold:</span><span>f = 1</span></div>
                        <div class=\"metric\"><span>Required for Safety:</span><span>2f + 1 = 3</span></div>
                        <div class=\"metric\"><span>Required for Liveness:</span><span>f + 1 = 2</span></div>
                        <div class=\"metric\"><span>Consensus Algorithm:</span><span>Malachite BFT</span></div>
                        <div class=\"metric\"><span>Block Interval:</span><span>5 seconds</span></div>
                    </div>
                    
                    <div class=\"card validator-card\">
                        <h3>🏗️ Validator 1 (Genesis)</h3>
                        <div class=\"metric\"><span>Address:</span><span>0x...0001</span></div>
                        <div class=\"metric\"><span>Type:</span><span>Genesis Validator</span></div>
                        <div class=\"metric\"><span>API:</span><span><a href=\"http://localhost:8080/health\" target=\"_blank\">172.22.0.10:8080</a></span></div>
                        <div class=\"metric\"><span>P2P:</span><span>172.22.0.10:26656</span></div>
                        <div class=\"metric\"><span>Consensus:</span><span>172.22.0.10:9090</span></div>
                    </div>
                    
                    <div class=\"card validator-card\">
                        <h3>🏗️ Validator 2</h3>
                        <div class=\"metric\"><span>Address:</span><span>0x...0002</span></div>
                        <div class=\"metric\"><span>Type:</span><span>Validator</span></div>
                        <div class=\"metric\"><span>API:</span><span><a href=\"http://localhost:8081/health\" target=\"_blank\">172.22.0.11:8080</a></span></div>
                        <div class=\"metric\"><span>P2P:</span><span>172.22.0.11:26656</span></div>
                        <div class=\"metric\"><span>Consensus:</span><span>172.22.0.11:9090</span></div>
                    </div>
                    
                    <div class=\"card validator-card\">
                        <h3>🏗️ Validator 3</h3>
                        <div class=\"metric\"><span>Address:</span><span>0x...0003</span></div>
                        <div class=\"metric\"><span>Type:</span><span>Validator</span></div>
                        <div class=\"metric\"><span>API:</span><span><a href=\"http://localhost:8082/health\" target=\"_blank\">172.22.0.12:8080</a></span></div>
                        <div class=\"metric\"><span>P2P:</span><span>172.22.0.12:26656</span></div>
                        <div class=\"metric\"><span>Consensus:</span><span>172.22.0.12:9090</span></div>
                    </div>
                </div>
                
                <div class=\"card\">
                    <h3>🔍 Real-time Consensus Status</h3>
                    <div id=\"consensus-status\">
                        <p><em>Checking validator health...</em></p>
                    </div>
                </div>
                
                <div class=\"card\">
                    <h3>📚 Learn More</h3>
                    <p><strong>Malachite BFT:</strong> <a href=\"https://github.com/informalsystems/malachite\" target=\"_blank\">https://github.com/informalsystems/malachite</a></p>
                    <p><strong>Byzantine Fault Tolerance:</strong> Tolerates up to f=1 malicious or crashed validators</p>
                    <p><strong>Consensus Phases:</strong> Propose → Prevote → Precommit → Commit</p>
                    <p><strong>Safety Guarantee:</strong> No two validators commit different blocks at the same height</p>
                    <p><strong>Liveness Guarantee:</strong> Progress is made when network is synchronous</p>
                </div>
            </div>
            
            <script>
                async function updateConsensusStatus() {
                    const validators = ['172.22.0.10:8080', '172.22.0.11:8080', '172.22.0.12:8080'];
                    let statusHtml = '';
                    let healthyCount = 0;
                    
                    for (let i = 0; i < validators.length; i++) {
                        try {
                            const response = await fetch('http://' + validators[i] + '/health');
                            if (response.ok) {
                                healthyCount++;
                                statusHtml += '<div class=\"metric\"><span>Validator ' + (i+1) + ':</span><span class=\"status-healthy\">Healthy ✓</span></div>';
                            } else {
                                statusHtml += '<div class=\"metric\"><span>Validator ' + (i+1) + ':</span><span class=\"status-unhealthy\">Unhealthy ✗</span></div>';
                            }
                        } catch (e) {
                            statusHtml += '<div class=\"metric\"><span>Validator ' + (i+1) + ':</span><span class=\"status-unhealthy\">Unreachable ✗</span></div>';
                        }
                    }
                    
                    const canCommit = healthyCount >= 2;
                    statusHtml += '<div class=\"metric\"><span>Healthy Validators:</span><span>' + healthyCount + '/3</span></div>';
                    statusHtml += '<div class=\"metric\"><span>Consensus Status:</span><span class=\"' + (canCommit ? 'status-healthy' : 'status-unhealthy') + '\">' + (canCommit ? 'Can Commit Blocks ✓' : 'Cannot Commit Blocks ✗') + '</span></div>';
                    
                    document.getElementById('consensus-status').innerHTML = statusHtml;
                }
                
                // Update status every 10 seconds
                updateConsensusStatus();
                setInterval(updateConsensusStatus, 10000);
            </script>
        </body>
        </html>
        EOF
        
        # Serve the dashboard
        while true; do
          echo -e 'HTTP/1.1 200 OK\r\nContent-Type: text/html\r\nAccess-Control-Allow-Origin: *\r\n\r\n' > /tmp/response
          cat /tmp/dashboard.html >> /tmp/response
          cat /tmp/response | nc -l -p 3000 -q 1
        done
      "

volumes:
  validator1-data:
  validator2-data:
  validator3-data: