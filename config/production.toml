# MultiVM Production Configuration
# This configuration is optimized for production deployment

[system]
data_dir = "./data"
max_processes = 10
process_restart_delay = { secs = 5, nanos = 0 }
health_check_interval = { secs = 30, nanos = 0 }
shutdown_timeout = { secs = 30, nanos = 0 }
enable_metrics = true
metrics_port = 9090

[system.resource_limits]
max_memory_mb = 8192
max_cpu_percent = 80.0
max_disk_usage_gb = 100
max_open_files = 1024
max_rpc_connections = 1000

[solana]
enabled = true
data_dir = "./data/solana"
ledger_path = "./data/solana/ledger"
accounts_path = "./data/solana/accounts"
chain_id = 103

[solana.rpc_config]
host = "127.0.0.1"
port = 8899
max_connections = 1000
request_timeout = { secs = 30, nanos = 0 }
cors_origins = ["*"]

[ethereum]
enabled = true
data_dir = "./data/ethereum"
chain_id = 1

[ethereum.rpc_config]
host = "127.0.0.1"
port = 8545
max_connections = 1000
request_timeout = { secs = 30, nanos = 0 }
cors_origins = ["*"]

[ipc]
message_timeout = { secs = 30, nanos = 0 }
max_message_size = 16777216
buffer_size = 1048576

[ipc.transport]
UnixSocket = { path = "./data/ipc" }

[logging]
level = "Info"
file_path = "./logs/multivm.log"
enable_json = false
enable_colors = true