# MultiVM Staging Configuration

[system]
data_dir = "/opt/multivm/data"
max_processes = 10
process_restart_delay = { secs = 5, nanos = 0 }
health_check_interval = { secs = 30, nanos = 0 }
shutdown_timeout = { secs = 30, nanos = 0 }
enable_metrics = true
metrics_port = 9090

[logging]
level = "info"
format = "json"
enable_file_logging = true
log_directory = "/var/log/multivm"
max_log_files = 50

[consensus]
algorithm = "malachite"
block_time_ms = 1000
validator_count = 3
enable_single_node = false

[network]
enable_p2p = true
listen_port = 8000
bootstrap_nodes = [
    "staging-node-1:8000",
    "staging-node-2:8000"
]

[ipc]
transport = "unix_socket"
socket_path = "/var/run/multivm/multivm.sock"
timeout_ms = 10000

[mock_processes]
enable_mock_solana = false
enable_mock_reth = false