# MultiVM Development Configuration

[system]
data_dir = "./data"
max_processes = 5
process_restart_delay = { secs = 2, nanos = 0 }
health_check_interval = { secs = 10, nanos = 0 }
shutdown_timeout = { secs = 15, nanos = 0 }
enable_metrics = true
metrics_port = 9090

[logging]
level = "debug"
format = "pretty"
enable_file_logging = true
log_directory = "./logs"
max_log_files = 10

[consensus]
algorithm = "malachite"
block_time_ms = 2000
validator_count = 1
enable_single_node = true

[network]
enable_p2p = false
listen_port = 8000
bootstrap_nodes = []

[ipc]
transport = "unix_socket"
socket_path = "/tmp/multivm.sock"
timeout_ms = 5000

[mock_processes]
enable_mock_solana = true
enable_mock_reth = true
mock_processing_delay_ms = 10