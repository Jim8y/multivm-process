# MultiVM Production Environment Configuration
# Based on the unified schema with production-ready security settings

[system]
data_dir = "/opt/multivm/data"
log_level = "info"
log_format = "json"
enable_metrics = true
enable_tracing = true
max_processes = 50
process_restart_delay_seconds = 10
health_check_interval_seconds = 30
shutdown_timeout_seconds = 60

[server]
[server.rest]
host = "127.0.0.1"  # Bind to localhost only in production
port = 8080
enable_cors = false  # Disable CORS in production
request_timeout_seconds = 30
max_request_size_bytes = 8388608  # 8MB limit in production
enable_compression = true

[server.graphql]
host = "127.0.0.1"  # Localhost only
port = 8081
enable_playground = false  # Disable playground in production
query_timeout_seconds = 15  # Shorter timeout in production
query_complexity_limit = 500  # Lower complexity limit
enable_introspection = false  # Disable introspection in production

[server.websocket]
host = "127.0.0.1"
port = 8082
connection_timeout_seconds = 30  # Shorter timeout in production
max_connections = 5000  # Higher limit for production
ping_interval_seconds = 30

[server.admin]
host = "127.0.0.1"  # Localhost only for security
port = 8083
enable_ui = false  # Disable admin UI in production
require_auth = true  # Always require auth in production

[database]
# Use environment variable for full connection string
connection_url = "postgresql://multivm:${MULTIVM_DB_PASSWORD}@db-cluster:5432/multivm_prod"
max_connections = 200  # Higher limit for production
min_connections = 20
connection_timeout_seconds = 10  # Shorter timeout
query_timeout_seconds = 30  # Shorter timeout
enable_ssl = true  # Always use SSL in production
migration_timeout_seconds = 600

[cache]
strategy = "WriteThrough"
default_ttl_seconds = 3600  # Longer TTL in production
max_memory_bytes = 2147483648  # 2GB for production

[cache.redis]
# Use environment variable for connection URL with credentials
connection_url = "redis://:${MULTIVM_REDIS_PASSWORD}@redis-cluster:6379/0"
key_prefix = "multivm:prod:"
connection_timeout_seconds = 3  # Shorter timeout
command_timeout_seconds = 5   # Shorter timeout
enable_cluster = true  # Use Redis cluster in production

[cache.memory]
max_items = 1000000  # Higher limit for production
eviction_policy = "LRU"

[blockchain_clients]
[blockchain_clients.solana]
rpc_url = "https://solana-mainnet.example.com:8899"
timeout_seconds = 15  # Shorter timeout in production
max_retries = 5  # More retries for reliability
retry_backoff_seconds = 3
enable_health_checks = true
health_check_interval_seconds = 120  # Less frequent health checks

[blockchain_clients.ethereum]
rpc_url = "https://ethereum-mainnet.example.com:8545"
timeout_seconds = 15
max_retries = 5
retry_backoff_seconds = 3
enable_health_checks = true
health_check_interval_seconds = 120

[blockchain_clients.multivm]
rpc_url = "https://multivm-cluster.example.com:9000"
timeout_seconds = 15
max_retries = 5
retry_backoff_seconds = 3
enable_health_checks = true
health_check_interval_seconds = 120

[consensus]
algorithm = "malachite"
block_time_milliseconds = 1000  # Fast blocks for production
validator_count = 21  # Production validator set
enable_single_node = false  # Multi-node consensus
finality_depth = 12  # Conservative finality depth
max_block_size_bytes = 4194304  # 4MB

[consensus.malachite]
timeout_propose_milliseconds = 2000
timeout_prevote_milliseconds = 800
timeout_precommit_milliseconds = 800
timeout_commit_milliseconds = 800
skip_timeout_commit = false

[network]
enable_p2p = true  # Enable P2P in production
listen_host = "0.0.0.0"
listen_port = 26656
external_address = "multivm-node.example.com:26656"
max_connections = 200  # Higher limit for production
connection_timeout_seconds = 5  # Shorter timeout
enable_upnp = false  # Disable UPnP in production

[network.discovery]
enable_mdns = false  # Disable mDNS in production
enable_kad = true   # Enable Kademlia DHT
bootstrap_nodes = [
    "/dns4/bootstrap1.multivm.network/tcp/26656/p2p/12D3KooWBootstrap1",
    "/dns4/bootstrap2.multivm.network/tcp/26656/p2p/12D3KooWBootstrap2",
    "/dns4/bootstrap3.multivm.network/tcp/26656/p2p/12D3KooWBootstrap3"
]

[ipc]
transport = "unix_socket"
socket_path = "/var/run/multivm/multivm.sock"
tcp_host = "127.0.0.1"
tcp_port = 9090
timeout_milliseconds = 5000
enable_encryption = true  # Always enable encryption in production
max_message_size_bytes = 8388608  # 8MB limit

[security]
enable_authentication = true  # Always enable in production
enable_encryption = true      # Always enable in production
enable_rate_limiting = true   # Always enable in production
max_requests_per_minute = 1000  # Strict rate limiting
jwt_expiration_hours = 8  # Shorter expiration in production
api_key_length = 64  # Longer API keys

[security.secrets]
jwt_secret_env = "MULTIVM_JWT_SECRET"
database_password_env = "MULTIVM_DB_PASSWORD"
redis_password_env = "MULTIVM_REDIS_PASSWORD"
encryption_key_env = "MULTIVM_ENCRYPTION_KEY"

[monitoring]
enable_prometheus = true
prometheus_host = "127.0.0.1"  # Localhost only
prometheus_port = 9090
enable_jaeger = true  # Enable tracing in production
jaeger_endpoint = "http://jaeger-collector:14268/api/traces"
service_name = "multivm-prod"

[monitoring.health_check]
enable_endpoint = true
host = "127.0.0.1"  # Localhost only
port = 8090
path = "/health"

[logging]
level = "info"  # Less verbose in production
format = "json"  # Structured logging for production
enable_file_logging = true
log_directory = "/var/log/multivm"
max_file_size_bytes = 104857600  # 100MB
max_log_files = 50  # Keep more logs in production
enable_log_rotation = true

[execution_engines]
enable_mock_solana = false  # Use real engines in production
enable_mock_ethereum = false

[execution_engines.solana]
binary_path = "/usr/bin/solana-validator"
config_path = "/etc/multivm/solana/validator.json"
data_dir = "/opt/multivm/data/solana"
enable_rpc = true
rpc_port = 8899

[execution_engines.ethereum]
binary_path = "/usr/bin/reth"
config_path = "/etc/multivm/ethereum/reth.toml"
data_dir = "/opt/multivm/data/ethereum"
enable_rpc = true
rpc_port = 8545