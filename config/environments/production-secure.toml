# MultiVM Production-Secure Configuration Template

[system]
data_dir = "/opt/multivm/data"
max_processes = 20
process_restart_delay = { secs = 5, nanos = 0 }
health_check_interval = { secs = 30, nanos = 0 }
shutdown_timeout = { secs = 30, nanos = 0 }
enable_metrics = true
metrics_port = 9090

[logging]
level = "info"
format = "json"
enable_file_logging = true
log_directory = "/var/log/multivm"
max_log_files = 100

[consensus]
algorithm = "malachite"
block_time_ms = 1000
validator_count = 7
enable_single_node = false

[network]
enable_p2p = true
listen_port = 8000
bootstrap_nodes = [
    # Add your production bootstrap nodes here
]

[ipc]
transport = "unix_socket"
socket_path = "/var/run/multivm/multivm.sock"
timeout_ms = 10000
enable_encryption = true  # ENABLED for production

[security]
enable_authentication = true  # ENABLED for production
enable_encryption = true     # ENABLED for production
jwt_secret_env = "MULTIVM_JWT_SECRET"  # Must be set via environment
api_key_storage = "database"
rate_limiting = true

[application]
[application.server]
[application.server.rest]
host = "127.0.0.1"  # Bind to localhost only
port = 8080

[application.server.admin]
host = "127.0.0.1"  # Admin interface localhost only
port = 8083
enable_ui = false   # Disabled by default for security

[application.auth]
# JWT secret MUST be provided via MULTIVM_JWT_SECRET environment variable
enable_api_keys = true
require_auth = true  # ENABLED for production

[application.cors]
enabled = false      # Disabled by default
allowed_origins = [] # Specific origins only in production

# Database configuration - credentials via environment variables
[application.database]
host = "localhost"
port = 5432
name = "multivm_production"
username_env = "MULTIVM_DB_USER"
password_env = "MULTIVM_DB_PASSWORD"
ssl_mode = "require"
max_connections = 50

# Cache configuration
[application.cache]
strategy = "redis"
[application.cache.redis]
url_env = "MULTIVM_REDIS_URL"
pool_size = 20

[mock_processes]
enable_mock_solana = false  # Real processes in production
enable_mock_reth = false    # Real processes in production