# MultiVM Development Environment Configuration
# Based on the unified schema with development-friendly settings

[system]
data_dir = "./data"
log_level = "debug"
log_format = "pretty"
enable_metrics = true
enable_tracing = true
max_processes = 10
process_restart_delay_seconds = 3
health_check_interval_seconds = 15
shutdown_timeout_seconds = 10

[server]
[server.rest]
host = "0.0.0.0"
port = 8080
enable_cors = true  # Allow CORS for development
request_timeout_seconds = 30
max_request_size_bytes = 16777216
enable_compression = false  # Disable for easier debugging

[server.graphql]
host = "0.0.0.0"
port = 8081
enable_playground = true  # Enable GraphQL playground in development
query_timeout_seconds = 30
query_complexity_limit = 1000
enable_introspection = true  # Allow introspection in development

[server.websocket]
host = "0.0.0.0"
port = 8082
connection_timeout_seconds = 60
max_connections = 100  # Lower limit for development
ping_interval_seconds = 30

[server.admin]
host = "0.0.0.0"  # Allow external access in development
port = 8083
enable_ui = true  # Enable admin UI in development
require_auth = false  # Disable auth for easier development

[database]
connection_url = "postgresql://multivm:multivm@localhost:5432/multivm_dev"
max_connections = 10  # Lower limit for development
min_connections = 2
connection_timeout_seconds = 30
query_timeout_seconds = 60
enable_ssl = false  # Disable SSL for local development
migration_timeout_seconds = 300

[cache]
strategy = "WriteThrough"
default_ttl_seconds = 60  # Shorter TTL for development
max_memory_bytes = 134217728  # 128MB for development

[cache.redis]
connection_url = "redis://localhost:6379/1"  # Use different DB for dev
key_prefix = "multivm:dev:"
connection_timeout_seconds = 5
command_timeout_seconds = 10
enable_cluster = false

[cache.memory]
max_items = 10000  # Lower limit for development
eviction_policy = "LRU"

[blockchain_clients]
[blockchain_clients.solana]
rpc_url = "http://localhost:8899"
timeout_seconds = 30
max_retries = 3
retry_backoff_seconds = 1  # Faster retries in development
enable_health_checks = true
health_check_interval_seconds = 30

[blockchain_clients.ethereum]
rpc_url = "http://localhost:8545"
timeout_seconds = 30
max_retries = 3
retry_backoff_seconds = 1
enable_health_checks = true
health_check_interval_seconds = 30

[blockchain_clients.multivm]
rpc_url = "http://localhost:9000"
timeout_seconds = 30
max_retries = 3
retry_backoff_seconds = 1
enable_health_checks = true
health_check_interval_seconds = 30

[consensus]
algorithm = "malachite"
block_time_milliseconds = 5000  # Slower blocks for development
validator_count = 1  # Single validator for development
enable_single_node = true  # Single node mode
finality_depth = 1  # Immediate finality for development
max_block_size_bytes = 1048576  # 1MB

[consensus.malachite]
timeout_propose_milliseconds = 5000
timeout_prevote_milliseconds = 2000
timeout_precommit_milliseconds = 2000
timeout_commit_milliseconds = 2000
skip_timeout_commit = false

[network]
enable_p2p = false  # Disable P2P for single node development
listen_host = "127.0.0.1"
listen_port = 26656
external_address = ""
max_connections = 10
connection_timeout_seconds = 10
enable_upnp = false

[network.discovery]
enable_mdns = false
enable_kad = false
bootstrap_nodes = []

[ipc]
transport = "unix_socket"
socket_path = "./tmp/multivm-dev.sock"
tcp_host = "127.0.0.1"
tcp_port = 9090
timeout_milliseconds = 5000
enable_encryption = false  # Disable encryption for easier debugging
max_message_size_bytes = 16777216

[security]
enable_authentication = false  # Disable for development
enable_encryption = false      # Disable for development
enable_rate_limiting = false   # Disable for development
max_requests_per_minute = 10000
jwt_expiration_hours = 24
api_key_length = 32

[security.secrets]
jwt_secret_env = "MULTIVM_DEV_JWT_SECRET"
database_password_env = "MULTIVM_DEV_DB_PASSWORD"
redis_password_env = "MULTIVM_DEV_REDIS_PASSWORD"
encryption_key_env = "MULTIVM_DEV_ENCRYPTION_KEY"

[monitoring]
enable_prometheus = true
prometheus_host = "0.0.0.0"
prometheus_port = 9090
enable_jaeger = false  # Disable tracing in development
jaeger_endpoint = "http://localhost:14268/api/traces"
service_name = "multivm-dev"

[monitoring.health_check]
enable_endpoint = true
host = "0.0.0.0"
port = 8090
path = "/health"

[logging]
level = "debug"
format = "pretty"  # Human-readable format for development
enable_file_logging = false  # Use console only in development
log_directory = "./logs"
max_file_size_bytes = 10485760  # 10MB
max_log_files = 5
enable_log_rotation = true

[execution_engines]
enable_mock_solana = true  # Use mock engines in development
enable_mock_ethereum = true

[execution_engines.solana]
binary_path = "/usr/local/bin/solana-validator"
config_path = "./config/solana-dev.json"
data_dir = "./data/solana"
enable_rpc = true
rpc_port = 8899

[execution_engines.ethereum]
binary_path = "/usr/local/bin/reth"
config_path = "./config/reth-dev.toml"
data_dir = "./data/ethereum"
enable_rpc = true
rpc_port = 8545