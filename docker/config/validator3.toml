# Malachite BFT Validator 3 Configuration

[node]
id = "validator-3"
type = "validator"
data_dir = "/opt/multivm/data"
log_dir = "/opt/multivm/logs"

[api]
rest_port = 8080
graphql_port = 8081
websocket_port = 8082
admin_port = 8083
enable_cors = true
cors_origins = ["*"]
jwt_secret = "malachite-validator3-secret"

[p2p]
listen_address = "0.0.0.0:26656"
external_address = "172.22.0.12:26656"
seeds = ""
persistent_peers = "validator-1@172.22.0.10:26656,validator-2@172.22.0.11:26656"
max_peers = 50
handshake_timeout = "30s"
dial_timeout = "10s"

# libp2p specific settings
enable_mdns = false
enable_kademlia = true
enable_gossipsub = true
enable_identify = true

# P2P security
enable_encryption = true
enable_authentication = true

[consensus]
# Malachite BFT Configuration
algorithm = "malachite-bft"
listen_address = "0.0.0.0:26657"
validator_address = "0x0000000000000000000000000000000000000003"

# Block production
block_time_ms = 5000
max_block_size = 1048576  # 1MB
max_transactions_per_block = 1000

# Malachite BFT Timeouts
timeout_propose = "3s"
timeout_prevote = "1s"
timeout_precommit = "1s"
timeout_commit = "5s"

# Validator settings
is_genesis_validator = false
validator_set_size = 3
byzantine_fault_tolerance = true

# Validator keys
validator_key_file = "/opt/multivm/data/validator3_key.json"
priv_validator_key_file = "/opt/multivm/data/validator3_priv_key.json"

[execution]
evm_enabled = true
svm_enabled = true
evm_ipc_path = "./data/evm.ipc"
svm_ipc_path = "./data/svm.ipc"
max_gas_per_block = 10000000
min_gas_price = "1000000000"  # 1 gwei

[cache]
redis_enabled = false
redis_url = "redis://localhost:6379"
rocksdb_enabled = true
rocksdb_path = "./data/rocksdb"
cache_size_mb = 1024
ttl_seconds = 3600

[monitoring]
enable_metrics = true
metrics_port = 9464
metrics_path = "/metrics"
enable_tracing = true
tracing_endpoint = ""
enable_profiling = false
profiling_port = 6060

# Health check
enable_health_check = true
health_check_interval_secs = 30
health_check_timeout_secs = 5

[security]
enable_tls = false
tls_cert_file = ""
tls_key_file = ""
enable_rate_limiting = true
rate_limit_per_peer = 100
rate_limit_global = 1000
ban_duration_secs = 600
max_failed_attempts = 5

[database]
db_backend = "rocksdb"
db_dir = "./data/db"
db_cache_size = 536870912  # 512MB
db_write_buffer_size = 67108864  # 64MB
db_max_open_files = 1000

[logging]
level = "info"
format = "json"
output = "stdout"
file = "./logs/validator3.log"
max_size_mb = 100
max_backups = 10
max_age_days = 30
compress = true