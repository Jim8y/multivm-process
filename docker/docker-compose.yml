# MultiVM Process - Multi-Node Testing Environment
version: '3.8'

services:
  # MultiVM Node 1 (Bootstrap Node)
  multivm-node-1:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: multivm-node-1
    hostname: multivm-node-1
    environment:
      - NODE_ID=node-1
      - NODE_TYPE=bootstrap
      - P2P_LISTEN_ADDR=0.0.0.0:26656
      - API_LISTEN_ADDR=0.0.0.0:8080
      - CONSENSUS_ROLE=validator
      - LOG_LEVEL=info
      - BOOTSTRAP_NODES=
      - VALIDATOR_KEY=validator-1-key
    ports:
      - "8080:8080"   # REST API
      - "26656:26656" # P2P
      - "8545:8545"   # EVM RPC
      - "8899:8899"   # SVM RPC
    volumes:
      - multivm-node-1-data:/opt/multivm/data
      - ./config/node-1.toml:/opt/multivm/config/multivm.toml:ro
      - ./logs:/opt/multivm/logs
    networks:
      multivm-net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MultiVM Node 2 (Validator)
  multivm-node-2:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: multivm-node-2
    hostname: multivm-node-2
    environment:
      - NODE_ID=node-2
      - NODE_TYPE=validator
      - P2P_LISTEN_ADDR=0.0.0.0:26656
      - API_LISTEN_ADDR=0.0.0.0:8080
      - CONSENSUS_ROLE=validator
      - LOG_LEVEL=info
      - BOOTSTRAP_NODES=multivm-node-1:26656
      - VALIDATOR_KEY=validator-2-key
    ports:
      - "8081:8080"   # REST API
      - "26657:26656" # P2P
      - "8546:8545"   # EVM RPC
      - "8900:8899"   # SVM RPC
    volumes:
      - multivm-node-2-data:/opt/multivm/data
      - ./config/node-2.toml:/opt/multivm/config/multivm.toml:ro
      - ./logs:/opt/multivm/logs
    networks:
      multivm-net:
        ipv4_address: 172.20.0.11
    depends_on:
      multivm-node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MultiVM Node 3 (Validator)
  multivm-node-3:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: multivm-node-3
    hostname: multivm-node-3
    environment:
      - NODE_ID=node-3
      - NODE_TYPE=validator
      - P2P_LISTEN_ADDR=0.0.0.0:26656
      - API_LISTEN_ADDR=0.0.0.0:8080
      - CONSENSUS_ROLE=validator
      - LOG_LEVEL=info
      - BOOTSTRAP_NODES=multivm-node-1:26656,multivm-node-2:26656
      - VALIDATOR_KEY=validator-3-key
    ports:
      - "8082:8080"   # REST API
      - "26658:26656" # P2P
      - "8547:8545"   # EVM RPC
      - "8901:8899"   # SVM RPC
    volumes:
      - multivm-node-3-data:/opt/multivm/data
      - ./config/node-3.toml:/opt/multivm/config/multivm.toml:ro
      - ./logs:/opt/multivm/logs
    networks:
      multivm-net:
        ipv4_address: 172.20.0.12
    depends_on:
      multivm-node-1:
        condition: service_healthy
      multivm-node-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MultiVM Node 4 (Full Node)
  multivm-node-4:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: multivm-node-4
    hostname: multivm-node-4
    environment:
      - NODE_ID=node-4
      - NODE_TYPE=full
      - P2P_LISTEN_ADDR=0.0.0.0:26656
      - API_LISTEN_ADDR=0.0.0.0:8080
      - CONSENSUS_ROLE=observer
      - LOG_LEVEL=info
      - BOOTSTRAP_NODES=multivm-node-1:26656,multivm-node-2:26656,multivm-node-3:26656
      - VALIDATOR_KEY=
    ports:
      - "8083:8080"   # REST API
      - "26659:26656" # P2P
      - "8548:8545"   # EVM RPC
      - "8902:8899"   # SVM RPC
    volumes:
      - multivm-node-4-data:/opt/multivm/data
      - ./config/node-4.toml:/opt/multivm/config/multivm.toml:ro
      - ./logs:/opt/multivm/logs
    networks:
      multivm-net:
        ipv4_address: 172.20.0.13
    depends_on:
      multivm-node-1:
        condition: service_healthy
      multivm-node-2:
        condition: service_healthy
      multivm-node-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Test Runner Service
  test-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    container_name: multivm-test-runner
    environment:
      - MULTIVM_NODES=multivm-node-1:8080,multivm-node-2:8080,multivm-node-3:8080,multivm-node-4:8080
      - TEST_TIMEOUT=300
      - LOG_LEVEL=debug
    volumes:
      - ./test-results:/opt/multivm/test-results
      - ./logs:/opt/multivm/logs
    networks:
      - multivm-net
    depends_on:
      multivm-node-1:
        condition: service_healthy
      multivm-node-2:
        condition: service_healthy
      multivm-node-3:
        condition: service_healthy
      multivm-node-4:
        condition: service_healthy
    profiles:
      - testing

  # Monitoring Service
  monitoring:
    image: prom/prometheus:latest
    container_name: multivm-monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - multivm-net
    profiles:
      - monitoring

  # Log Aggregator
  log-aggregator:
    image: grafana/loki:latest
    container_name: multivm-logs
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - multivm-net
    profiles:
      - monitoring

networks:
  multivm-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

volumes:
  multivm-node-1-data:
  multivm-node-2-data:
  multivm-node-3-data:
  multivm-node-4-data:
  prometheus-data:
  loki-data: