[package]
name = "reth-execution-engine"
version.workspace = true
authors = ["MultiVM Contributors"]
description = "Reth execution engine integration for MultiVM"
edition.workspace = true
license.workspace = true

[features]
default = ["mock"]
mock = []
real-node = []

[dependencies]
# Workspace dependencies
multivm-common = { path = "../multivm-common" }

# Async runtime and utilities
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = "0.11"
bincode = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Crypto and encoding
hex = { workspace = true }

# Concurrency utilities
once_cell = { workspace = true }

# HTTP client for RPC communication
reqwest = { workspace = true, features = ["json"] }

# CLI parsing
clap = { workspace = true }

# Random number generation for JWT secrets
rand = { workspace = true }

# JWT and HMAC for Engine API authentication
hmac = "0.12"
base64 = { workspace = true }
jsonwebtoken = { workspace = true }

# Basic Ethereum utilities for real implementation
alloy-primitives = { workspace = true }
alloy-consensus = { workspace = true }
alloy-rlp = { workspace = true }

# EVM for execution
revm = { workspace = true }

# JSON RPC (using current stable versions)
jsonrpsee = { workspace = true }

# Legacy JSON-RPC for compatibility
jsonrpc-http-server = { workspace = true }
jsonrpc-core = { workspace = true }

# Crypto hash dependencies
sha2 = { workspace = true }
sha3 = "0.10"
keccak = "0.1"

