[package]
name = "reth-execution-engine"
version.workspace = true
authors = ["MultiVM Contributors"]
description = "Reth execution engine integration for MultiVM"
edition.workspace = true
license.workspace = true

[features]
default = ["real-node"]
real-node = []

[dependencies]
# Workspace dependencies
multivm-common = { path = "../multivm-common" }

# Async runtime and utilities
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = "0.11"
bincode = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Crypto and encoding
hex = { workspace = true }

# Concurrency utilities
once_cell = { workspace = true }

# HTTP client for RPC communication
reqwest = { workspace = true, features = ["json"] }

# CLI parsing
clap = { workspace = true }

# Random number generation for JWT secrets
rand = { workspace = true }

# JWT and HMAC for Engine API authentication
hmac = "0.12"
base64 = "0.21"
jsonwebtoken = "9.2"

# Additional dependencies for enhanced engine API
parking_lot = "0.12"

# Note: Using custom types instead of alloy/revm to avoid c-kzg conflicts

# 使用 workspace 定义的依赖版本
ed25519-dalek = { workspace = true }
libp2p = { workspace = true }

# JSON RPC (using current stable versions)
jsonrpsee = { workspace = true }

# Legacy JSON-RPC for compatibility
jsonrpc-http-server = { workspace = true }
jsonrpc-core = { workspace = true }

# Crypto hash dependencies
sha2 = { workspace = true }
sha3 = "0.10"
keccak = "0.1"

# Note: Reth integration is done via process spawning and JSON-RPC, not direct library linking
# This avoids complex dependency conflicts with c-kzg and other native libraries



[dev-dependencies]
tempfile.workspace = true
tokio-test = "0.4"
tracing-test = "0.2"