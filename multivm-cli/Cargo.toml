[package]
name = "multivm-cli"
version.workspace = true
edition.workspace = true
authors = ["Multi-VM Team"]
description = "Command-line interface for multi-VM blockchain processing"
license.workspace = true

[[bin]]
name = "multivm-node"
path = "src/main.rs"

[[bin]]
name = "multivm-bench"
path = "src/bin/multivm-bench.rs"

[dependencies]
# Common types and traits
multivm-common = { path = "../multivm-common" }
multivm-application = { path = "../multivm-application" }
multivm-consensus = { path = "../multivm-consensus" }
multivm-process-manager = { path = "../multivm-process-manager" }

# Core dependencies
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Configuration
# Directory utilities removed for simplicity

# Time handling
chrono = { workspace = true }

# Async utilities
futures = { workspace = true }

# Additional dependencies for benchmark
env_logger = { workspace = true }
rand = { workspace = true }
multivm-account-mapping = { path = "../multivm-account-mapping" }

[dev-dependencies]
tempfile.workspace = true 