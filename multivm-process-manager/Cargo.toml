[package]
name = "multivm-process-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Process management service for the MultiVM platform"

[dependencies]
# Internal dependencies
multivm-common = { path = "../multivm-common" }
multivm-account-mapping = { path = "../multivm-account-mapping" }
multivm-consensus = { path = "../multivm-consensus" }

# Core async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Process management
nix = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Error handling and logging
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Cryptography and encoding
hex = { workspace = true }
bs58 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
# chacha20poly1305 = { workspace = true }  # Temporarily commented due to version conflict
jsonwebtoken = { workspace = true }

# System utilities
which = "6.0"
blake3 = "1.5"
sysinfo = { workspace = true }
reqwest = { workspace = true }

# Time and UUID
chrono = { workspace = true }
uuid = { workspace = true }

# Concurrency utilities
parking_lot = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = { workspace = true }
proptest = { workspace = true }

[features]
default = []
testing = []