[package]
name = "solana-execution-engine"
version = "0.1.0"
authors = ["MultiVM Contributors"]
description = "Solana execution engine integration for MultiVM"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "multivm-validator"
path = "src/bin/multivm-validator.rs"

[features]
default = ["mock"]
mock = []
real-node = []

[dependencies]
# Use multivm-common with resolved ed25519-dalek conflicts
multivm-common = { path = "../multivm-common" }

# Async runtime and utilities
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "fs", "net", "time", "sync", "signal", "process", "io-util"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto and encoding
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
# Use ed25519-dalek v1.0 for Solana compatibility
ed25519-dalek = { version = "=1.0.1", features = ["serde"] }

# Concurrency utilities
once_cell = "1.19"

# CLI parsing
clap = { version = "4.4", features = ["derive", "env"] }

# Solana dependencies
# The SDK has been moved out of agave, so we need to use crates.io for SDK
# Using v2.0.x to match multivm-agave v2.2.x
solana-sdk = "2.0"
# Use multivm-agave for client components
solana-client = { git = "ssh://git@github.com/vm-multiverse/multivm-agave.git", branch = "fix-extract-if-rust-188" }
solana-transaction-status = { git = "ssh://git@github.com/vm-multiverse/multivm-agave.git", branch = "fix-extract-if-rust-188" }
# Skip agave-validator due to compilation issues in multivm-agave
# agave-validator = { git = "ssh://git@github.com/vm-multiverse/multivm-agave.git", branch = "fix-extract-if-rust-188" }

# HTTP client for RPC communication
reqwest = { version = "0.11", features = ["json"] }

# RPC and networking (using modern JSON-RPC library)
jsonrpsee = "0.21"

# Legacy JSON-RPC for compatibility
jsonrpc-http-server = "18.0"
jsonrpc-core = "18.0"

# Additional dependencies for real integration
rand = "0.8"
hmac = "0.12"

