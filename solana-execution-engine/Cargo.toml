[package]
name = "solana-execution-engine"
version = "0.1.0"
authors = ["MultiVM Contributors"]
description = "Solana execution engine integration for MultiVM"
edition = "2021"
license = "Apache-2.0"

[features]
default = ["real-validator", "mock"]
simple = []
mock = []
real-validator = ["solana-sdk", "solana-client", "solana-transaction-status", "agave-validator"]

[[bin]]
name = "multivm-validator"
path = "src/bin/multivm-validator.rs"

[dependencies]
# Use multivm-common with resolved ed25519-dalek conflicts
multivm-common = { path = "../multivm-common" }

# Async runtime and utilities
tokio = { workspace = true }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto and encoding
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"

# Concurrency utilities
once_cell = "1.19"

# CLI parsing
clap = { version = "4.4", features = ["derive", "env"] }

# Solana dependencies (conditional - only when real-validator feature is enabled)
solana-sdk = { version = "=2.2.2", optional = true }
solana-client = { git = "ssh://git@github.com/vm-multiverse/multivm-agave.git", branch = "master", optional = true }
solana-transaction-status = { git = "ssh://git@github.com/vm-multiverse/multivm-agave.git", branch = "master", optional = true }
agave-validator = { git = "ssh://git@github.com/vm-multiverse/multivm-agave.git", branch = "master", optional = true }
solana-loader-v2-interface = { version = "=2.2.1", features = ["bincode"] }
solana-program = { version = "=2.2.1", default-features = false }
solana-clock = "=2.2.1"

# HTTP client for RPC communication
reqwest = { version = "0.11", features = ["json"] }

# RPC and networking (using modern JSON-RPC library)
jsonrpsee = "0.21"

# Legacy JSON-RPC for compatibility
jsonrpc-http-server = "18.0"
jsonrpc-core = "18.0"

# Additional dependencies for real integration
rand = "0.8"
hmac = "0.12"

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"
tracing-test = "0.2"
futures = "0.3"
ctor = "0.2"