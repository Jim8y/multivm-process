name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

# No concurrent releases
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: read

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup SSH authentication
      uses: ./.github/actions/setup-ssh
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
    
    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
          TAG="${{ github.event.inputs.version }}"
        else
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
        fi
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Release version: $VERSION"
        echo "Release tag: $TAG"
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
    
    - name: Validate workspace builds
      run: cargo build --workspace --release
    
    - name: Run full test suite
      run: cargo test --workspace --release
    
    - name: Check version consistency
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        
        # Check Cargo.toml versions match
        ROOT_VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
        if [ "$ROOT_VERSION" != "$VERSION" ]; then
          echo "❌ Root Cargo.toml version ($ROOT_VERSION) doesn't match release version ($VERSION)"
          exit 1
        fi
        
        echo "✅ Version consistency check passed"

  build-artifacts:
    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    needs: validate-release
    timeout-minutes: 30
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH authentication
      uses: ./.github/actions/setup-ssh
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: release-${{ matrix.target }}
    
    - name: Install cross-compilation tools
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
    
    - name: Build release binaries
      run: cargo build --workspace --release --target ${{ matrix.target }}
    
    - name: Package binaries
      shell: bash
      run: |
        VERSION="${{ needs.validate-release.outputs.version }}"
        ARCHIVE_NAME="multivm-$VERSION-${{ matrix.suffix }}"
        
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          ARCHIVE_NAME="$ARCHIVE_NAME.zip"
          7z a "$ARCHIVE_NAME" ./target/${{ matrix.target }}/release/*.exe
        else
          ARCHIVE_NAME="$ARCHIVE_NAME.tar.gz"
          tar -czf "$ARCHIVE_NAME" -C ./target/${{ matrix.target }}/release .
        fi
        
        echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARCHIVE_NAME }}
        path: ${{ env.ARCHIVE_NAME }}
        retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-release, build-artifacts]
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup SSH authentication
      uses: ./.github/actions/setup-ssh
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Generate changelog
      run: |
        VERSION="${{ needs.validate-release.outputs.version }}"
        TAG="${{ needs.validate-release.outputs.tag }}"
        
        echo "# Release $TAG" > changelog.md
        echo "" >> changelog.md
        
        # Get commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$LAST_TAG" ]; then
          echo "## Changes since $LAST_TAG" >> changelog.md
          git log --pretty=format:"- %s" $LAST_TAG..HEAD >> changelog.md
        else
          echo "## Initial Release" >> changelog.md
          echo "This is the first release of MultiVM Process Manager." >> changelog.md
        fi
        
        echo "" >> changelog.md
        echo "## Checksums" >> changelog.md
        
        # Generate checksums for all artifacts
        for file in multivm-*; do
          if [ -f "$file" ]; then
            echo "- \`$file\`: \`$(sha256sum "$file" | cut -d' ' -f1)\`" >> changelog.md
          fi
        done
    
    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.validate-release.outputs.tag }}
        name: Release ${{ needs.validate-release.outputs.tag }}
        body_path: changelog.md
        files: multivm-*
        draft: false
        prerelease: ${{ contains(needs.validate-release.outputs.version, '-') }}
        generate_release_notes: true