name: Test Private Repository Access (SSH and Token)

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      test_repo:
        description: 'Private repository to test (format: org/repo)'
        required: false
        default: 'your-org/your-private-repo'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  test-ssh-access:
    name: Test SSH Access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout current repository
      uses: actions/checkout@v4
    
    - name: Setup SSH for private dependencies
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_KEY }}
    
    - name: Configure Git for private dependencies
      run: |
        # Configure git to use HTTPS with token for all GitHub repositories
        git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
        git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
        echo "GitHub token authentication configured for private repository access"
    
    - name: Test token access
      run: |
        echo "🔍 Testing GitHub token access..."
        
        # Test HTTPS connection with token
        echo "Testing HTTPS connection with token:"
        curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/user | jq -r .login || echo "Unable to authenticate"
    
    - name: Test HTTPS clone of current repository
      run: |
        echo "🏢 Testing HTTPS clone of current repository..."
        
        # Clone current repository using HTTPS with token
        if git clone https://github.com/${{ github.repository }}.git test-current-https; then
          echo "✅ HTTPS clone of current repository successful"
          ls -la test-current-https/
          rm -rf test-current-https/
        else
          echo "❌ HTTPS clone of current repository failed"
          exit 1
        fi
    
    - name: Test HTTPS clone of private repository (if specified)
      if: github.event.inputs.test_repo != 'your-org/your-private-repo'
      run: |
        echo "🔒 Testing HTTPS clone of private repository..."
        TEST_REPO="${{ github.event.inputs.test_repo }}"
        
        # Clone private repository using HTTPS with token
        echo "Testing HTTPS clone of: $TEST_REPO"
        if git clone https://github.com/$TEST_REPO.git test-private-https; then
          echo "✅ HTTPS clone of private repository successful"
          ls -la test-private-https/
          rm -rf test-private-https/
        else
          echo "❌ HTTPS clone of private repository failed"
          exit 1
        fi
    
    - name: Verify token git config
      run: |
        echo "📥 Verifying Git configuration..."
        
        # Show git config
        echo "Git URL rewrites:"
        git config --get-regexp url
        
        # Test if HTTPS with token is properly configured
        echo "Testing HTTPS URL transformation:"
        git config --get url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf || echo "No URL rewrite found"
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Test Cargo private dependency access
      run: |
        echo "📦 Testing Cargo private dependency access..."
        
        # Check if Cargo.toml has any git dependencies
        if [ -f "Cargo.toml" ]; then
          echo "Checking workspace Cargo.toml for git dependencies:"
          if grep -n "git.*github.com" Cargo.toml; then
            echo "Found GitHub git dependencies in workspace"
          else
            echo "No GitHub git dependencies found in workspace Cargo.toml"
          fi
          
          # Check individual crate Cargo.toml files
          echo "Checking individual crate Cargo.toml files:"
          find . -name "Cargo.toml" -not -path "./target/*" | while read -r file; do
            if grep -l "git.*github.com" "$file" 2>/dev/null; then
              echo "Git dependencies found in: $file"
              grep -n "git.*github.com" "$file"
            fi
          done
          
          # Test cargo fetch (this will test private dependency access)
          echo "Testing cargo fetch with verbose output..."
          if cargo fetch --verbose 2>&1; then
            echo "✅ Cargo fetch successful - all dependencies accessible"
          else
            echo "❌ Cargo fetch failed - check private dependency access"
            exit 1
          fi
          
          # Test cargo check to ensure dependencies compile
          echo "Testing cargo check..."
          if cargo check --workspace --verbose 2>&1; then
            echo "✅ Cargo check successful - all dependencies compile"
          else
            echo "❌ Cargo check failed - dependency compilation issues"
            exit 1
          fi
        else
          echo "No Cargo.toml found in repository root"
        fi
    
    - name: Test SSH with different repository formats
      run: |
        echo "📋 Testing SSH with different URL formats..."
        
        # Test different URL formats that should be transformed
        TEST_URLS=(
          "https://github.com/${{ github.repository }}.git"
          "https://github.com/${{ github.repository }}"
          "git://github.com/${{ github.repository }}.git"
        )
        
        for url in "${TEST_URLS[@]}"; do
          echo "Testing URL: $url"
          # Use git ls-remote to test if URL is accessible
          if git ls-remote "$url" HEAD 2>/dev/null; then
            echo "✅ URL accessible via SSH transformation"
          else
            echo "❌ URL not accessible"
          fi
        done
    
    - name: Summary
      run: |
        echo "🎯 Token Access Test Summary:"
        echo "========================="
        echo "✅ GitHub token setup: Complete"
        echo "✅ HTTPS connection to GitHub: Tested"
        echo "✅ HTTPS clone of current repo: Working"
        echo "✅ Git URL rewriting: Configured"
        echo "✅ Cargo fetch via token: $([ $? -eq 0 ] && echo "Working" || echo "Check dependencies")"
        echo ""
        echo "If all tests pass, your GitHub token is properly configured!"
        echo "You can now access private repositories using token authentication."