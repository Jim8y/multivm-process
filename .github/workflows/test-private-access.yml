name: Test Private Repository Access (SSH and Token)

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      test_repo:
        description: 'Private repository to test (format: org/repo)'
        required: false
        default: 'your-org/your-private-repo'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  test-ssh-access:
    name: Test SSH Access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout current repository
      uses: actions/checkout@v4
    
    - name: Setup SSH for private dependencies
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
        git config --global url."git@github.com:".insteadOf "https://github.com/"
        echo "SSH authentication configured for private repository access"
    
    - name: Test SSH key access
      run: |
        echo "🔍 Testing SSH key access..."
        
        # Test SSH connection to GitHub
        echo "Testing SSH connection:"
        ssh -T git@github.com 2>&1 || true
        
        # Test listing SSH key fingerprint
        echo "SSH key fingerprint:"
        ssh-keygen -lf ~/.ssh/id_ed25519
    
    - name: Test SSH clone of current repository
      run: |
        echo "🏢 Testing SSH clone of current repository..."
        
        # Clone current repository using SSH
        if git clone git@github.com:${{ github.repository }}.git test-current-ssh; then
          echo "✅ SSH clone of current repository successful"
          ls -la test-current-ssh/
          rm -rf test-current-ssh/
        else
          echo "❌ SSH clone of current repository failed"
          exit 1
        fi
    
    - name: Test SSH clone of private repository (if specified)
      if: github.event.inputs.test_repo != 'your-org/your-private-repo'
      run: |
        echo "🔒 Testing SSH clone of private repository..."
        TEST_REPO="${{ github.event.inputs.test_repo }}"
        
        # Clone private repository using SSH
        echo "Testing SSH clone of: $TEST_REPO"
        if git clone git@github.com:$TEST_REPO.git test-private-ssh; then
          echo "✅ SSH clone of private repository successful"
          ls -la test-private-ssh/
          rm -rf test-private-ssh/
        else
          echo "❌ SSH clone of private repository failed"
          exit 1
        fi
    
    - name: Verify SSH git config
      run: |
        echo "📥 Verifying Git configuration..."
        
        # Show git config
        echo "Git URL rewrites:"
        git config --get-regexp url
        
        # Test if SSH is properly configured
        echo "Testing SSH URL transformation:"
        git config --get url."git@github.com:".insteadOf || echo "No URL rewrite found"
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Test Cargo private dependency access
      run: |
        echo "📦 Testing Cargo private dependency access..."
        
        # Check if Cargo.toml has any git dependencies
        if [ -f "Cargo.toml" ]; then
          echo "Checking workspace Cargo.toml for git dependencies:"
          if grep -n "git.*github.com" Cargo.toml; then
            echo "Found GitHub git dependencies in workspace"
          else
            echo "No GitHub git dependencies found in workspace Cargo.toml"
          fi
          
          # Check individual crate Cargo.toml files
          echo "Checking individual crate Cargo.toml files:"
          find . -name "Cargo.toml" -not -path "./target/*" | while read -r file; do
            if grep -l "git.*github.com" "$file" 2>/dev/null; then
              echo "Git dependencies found in: $file"
              grep -n "git.*github.com" "$file"
            fi
          done
          
          # Test cargo fetch (this will test private dependency access)
          echo "Testing cargo fetch with verbose output..."
          if cargo fetch --verbose 2>&1; then
            echo "✅ Cargo fetch successful - all dependencies accessible"
          else
            echo "❌ Cargo fetch failed - check private dependency access"
            exit 1
          fi
          
          # Test cargo check to ensure dependencies compile
          echo "Testing cargo check..."
          if cargo check --workspace --verbose 2>&1; then
            echo "✅ Cargo check successful - all dependencies compile"
          else
            echo "❌ Cargo check failed - dependency compilation issues"
            exit 1
          fi
        else
          echo "No Cargo.toml found in repository root"
        fi
    
    - name: Test SSH with different repository formats
      run: |
        echo "📋 Testing SSH with different URL formats..."
        
        # Test different URL formats that should be transformed
        TEST_URLS=(
          "https://github.com/${{ github.repository }}.git"
          "https://github.com/${{ github.repository }}"
          "git://github.com/${{ github.repository }}.git"
        )
        
        for url in "${TEST_URLS[@]}"; do
          echo "Testing URL: $url"
          # Use git ls-remote to test if URL is accessible
          if git ls-remote "$url" HEAD 2>/dev/null; then
            echo "✅ URL accessible via SSH transformation"
          else
            echo "❌ URL not accessible"
          fi
        done
    
    - name: Summary
      run: |
        echo "🎯 SSH Access Test Summary:"
        echo "========================="
        echo "✅ SSH key setup: Complete"
        echo "✅ SSH connection to GitHub: Tested"
        echo "✅ SSH clone of current repo: Working"
        echo "✅ Git URL rewriting: Configured"
        echo "✅ Cargo fetch via SSH: $([ $? -eq 0 ] && echo "Working" || echo "Check dependencies")"
        echo ""
        echo "If all tests pass, your SSH key is properly configured!"
        echo "You can now access private repositories using SSH authentication."