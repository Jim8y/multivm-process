name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Cancel old workflow runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock

permissions:
  contents: read
  packages: read

jobs:
  # Quick smoke test to fail fast
  quick-test:
    name: Quick Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH authentication
      uses: ./.github/actions/setup-ssh
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
    
    - name: Setup system dependencies
      uses: ./.github/actions/setup-dependencies
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Run quick check
      run: |
        # Quick compilation check without full build
        cargo check --workspace --all-features
    
    - name: Run minimal tests
      run: |
        # Run tests for the core common module only as a smoke test
        cargo test -p multivm-common --lib

  fmt-and-lint:
    name: Format and Lint
    runs-on: ubuntu-latest
    needs: quick-test
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH authentication
      uses: ./.github/actions/setup-ssh
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
    
    - name: Setup system dependencies
      uses: ./.github/actions/setup-dependencies
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: fmt-lint
    
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Run clippy
      run: cargo clippy --workspace --lib --bins --tests -- -W clippy::correctness -W clippy::suspicious -A warnings

  build-and-test:
    name: Build and Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    needs: fmt-and-lint
    timeout-minutes: 45
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
        include:
          # Add Windows with longer timeout
          - os: windows-latest
            rust: stable
            timeout-minutes: 60
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH authentication
      uses: ./.github/actions/setup-ssh
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
    
    - name: Setup system dependencies (Linux)
      uses: ./.github/actions/setup-dependencies
      if: runner.os == 'Linux'
    
    - name: Setup system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install pkg-config
    
    - name: Setup system dependencies (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "Windows dependencies setup complete"
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: llvm-tools-preview
    
    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: build-${{ matrix.rust }}
        cache-on-failure: true
    
    - name: Build workspace
      run: |
        echo "::group::Building all workspace members"
        cargo build --workspace --all-features --verbose
        echo "::endgroup::"
    
    - name: Build tests
      run: |
        echo "::group::Building all tests"
        cargo test --workspace --all-features --no-run --verbose
        echo "::endgroup::"
    
    - name: Run unit tests
      run: |
        echo "::group::Running unit tests"
        cargo test --workspace --lib --bins --all-features -- --nocapture
        echo "::endgroup::"
    
    - name: Run integration tests
      run: |
        echo "::group::Running integration tests"
        cargo test --workspace --test '*' --all-features -- --nocapture || true
        echo "::endgroup::"
      continue-on-error: true  # Integration tests may require external services
    
    - name: Run doc tests
      run: |
        echo "::group::Running documentation tests"
        cargo test --workspace --doc --all-features
        echo "::endgroup::"
    
    - name: Check for test failures
      run: |
        # Run tests again without continue-on-error to catch unit test failures
        cargo test --workspace --lib --bins --all-features --quiet
    
    - name: Generate test report
      if: always()
      run: |
        echo "## Test Summary" > test-report.md
        echo "Generated on: $(date)" >> test-report.md
        echo "" >> test-report.md
        
        # Count test results
        echo "### Test Statistics:" >> test-report.md
        cargo test --workspace --all-features -- --nocapture 2>&1 | tee test-output.log || true
        
        PASSED=$(grep -c "test result: ok" test-output.log || echo "0")
        FAILED=$(grep -c "test result: FAILED" test-output.log || echo "0")
        
        echo "- Tests passed: $PASSED" >> test-report.md
        echo "- Tests failed: $FAILED" >> test-report.md
        
        if [ "$FAILED" -gt "0" ]; then
          echo "" >> test-report.md
          echo "### Failed Tests:" >> test-report.md
          grep -B2 "FAILED" test-output.log >> test-report.md || true
        fi
    
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report-${{ matrix.rust }}
        path: test-report.md
        retention-days: 7
    
    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rust-build-artifacts-${{ matrix.rust }}
        path: |
          target/debug/
          Cargo.lock
        retention-days: 1

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: fmt-and-lint
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH authentication
      uses: ./.github/actions/setup-ssh
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
    
    - name: Setup system dependencies
      uses: ./.github/actions/setup-dependencies
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: release-build
        cache-on-failure: false
    
    - name: Build release binaries
      run: |
        echo "::group::Building release binaries"
        cargo build --workspace --release --all-features --verbose
        echo "::endgroup::"
    
    - name: List release artifacts
      run: |
        echo "::group::Release artifacts"
        find target/release -maxdepth 1 -type f -executable | sort
        echo "::endgroup::"
    
    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-binaries
        path: |
          target/release/multivm*
          !target/release/*.d
          !target/release/*.rlib
        retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH authentication
      uses: ./.github/actions/setup-ssh
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
    
    - name: Setup system dependencies
      uses: ./.github/actions/setup-dependencies
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-audit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit
    
    - name: Run security audit
      run: cargo audit
      continue-on-error: true  # Don't fail CI on security issues during development


  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH authentication
      uses: ./.github/actions/setup-ssh
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
    
    - name: Setup system dependencies
      uses: ./.github/actions/setup-dependencies
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview
    
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    
    - name: Generate coverage report
      run: |
        echo "::group::Running tests with coverage"
        cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
        echo "::endgroup::"
        
        echo "::group::Coverage summary"
        cargo llvm-cov report --summary-only
        echo "::endgroup::"
    
    - name: Generate HTML coverage report
      run: |
        cargo llvm-cov --workspace --all-features --html
        
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: target/llvm-cov/html/
        retention-days: 30
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: lcov.info
        fail_ci_if_error: false
        verbose: true
      continue-on-error: true
  
  # Summary job to check all required jobs passed
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [quick-test, fmt-and-lint, build-and-test, build-release, security-audit]
    if: always()
    
    steps:
    - name: Check job results
      run: |
        if [[ "${{ needs.quick-test.result }}" != "success" ]] || \
           [[ "${{ needs.fmt-and-lint.result }}" != "success" ]] || \
           [[ "${{ needs.build-and-test.result }}" != "success" ]] || \
           [[ "${{ needs.build-release.result }}" != "success" ]] || \
           [[ "${{ needs.security-audit.result }}" != "success" ]]; then
          echo "One or more required jobs failed"
          exit 1
        fi
        echo "All required CI jobs passed successfully!"