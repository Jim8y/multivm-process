name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Cancel old workflow runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock
  # Speed up builds
  CARGO_INCREMENTAL: 1
  RUST_LOG: off
  # Use faster linker when available
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
  # Optimize cargo operations
  CARGO_NET_RETRY: 10
  CARGO_NET_TIMEOUT: 60
  # Use registry cache
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # Increase stack size for release builds
  RUST_MIN_STACK: 16777216

permissions:
  contents: read
  packages: read

jobs:
  # Complete build job (no testing)
  build:
    name: Build Complete Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH authentication
      uses: ./.github/actions/setup-ssh
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
    
    - name: Setup system dependencies
      uses: ./.github/actions/setup-dependencies
    
    - name: Install build optimizations
      run: |
        sudo apt-get update
        sudo apt-get install -y lld clang
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly-2025-06-15
    
    # Use multiple cache strategies for maximum effectiveness
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-
    
    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.toml') }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.toml') }}-
          ${{ runner.os }}-cargo-build-
    
    - name: Setup Rust cache (additional layer)
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        cache-all-crates: true
        save-if: always
    
    - name: Configure optimized builds
      run: |
        # Configure cargo for maximum performance
        mkdir -p ~/.cargo
        cat > ~/.cargo/config.toml << 'EOF'
        [build]
        rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "target-cpu=native"]
        jobs = 0  # Use all cores
        
        [net]
        retry = 10
        timeout = 60000
        
        [registries.crates-io]
        protocol = "sparse"
        EOF
        
        # Remove Cargo.lock for fresh dependency resolution
        rm -f Cargo.lock
    
    - name: Build complete workspace
      run: |
        echo "::group::Building complete workspace including tests"
        
        # Build release workspace (all packages)
        echo "Building release workspace..."
        cargo +nightly-2025-06-15 build --workspace --release --all-features --jobs $(nproc)
        
        # Build all tests (but don't run them)
        echo "Building all tests..."
        cargo +nightly-2025-06-15 test --workspace --release --all-features --no-run --jobs $(nproc)
        
        # Build all benches
        echo "Building all benchmarks..."
        cargo +nightly-2025-06-15 bench --workspace --all-features --no-run --jobs $(nproc) || true
        
        # Build all examples
        echo "Building all examples..."
        cargo +nightly-2025-06-15 build --workspace --release --all-features --examples --jobs $(nproc) || true
        
        echo "::endgroup::"
    
    
    - name: Upload all build artifacts
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: release-build-artifacts-${{ github.sha }}
        path: |
          target/release/
          Cargo.lock
        retention-days: 1
        compression-level: 6
    
    outputs:
      artifact-name: release-build-artifacts-${{ github.sha }}

  # Security audit using pre-built artifacts
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    timeout-minutes: 60
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH authentication
      uses: ./.github/actions/setup-ssh
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
    
    - name: Setup system dependencies
      uses: ./.github/actions/setup-dependencies
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly-2025-06-15
    
    - name: Download pre-built artifacts
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build.outputs.artifact-name }}
        path: .
    
    - name: Install cargo-audit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit
    
    - name: Run security audit
      run: |
        # Skip security audit for now
        echo "Security audit check skipped"
        exit 0
      continue-on-error: true  # Don't fail CI on security issues during development

