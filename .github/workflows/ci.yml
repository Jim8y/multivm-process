name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Cancel old workflow runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock
  # Speed up builds
  CARGO_INCREMENTAL: 1
  RUST_LOG: off
  # Use faster linker when available
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
  # Optimize cargo operations
  CARGO_NET_RETRY: 10
  CARGO_NET_TIMEOUT: 60
  # Use registry cache
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

permissions:
  contents: read
  packages: read

jobs:
  # Single build job that compiles everything once
  build-all:
    name: Build Everything Once
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH authentication
      uses: ./.github/actions/setup-ssh
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
    
    - name: Setup system dependencies
      uses: ./.github/actions/setup-dependencies
    
    - name: Install build optimizations
      run: |
        sudo apt-get update
        sudo apt-get install -y lld clang
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly-2025-06-15
        components: rustfmt, clippy, llvm-tools-preview
    
    - name: Setup comprehensive cache
      uses: Swatinem/rust-cache@v2
      with:
        key: build-all-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}-${{ github.sha }}
        restore-keys: |
          build-all-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}-
          build-all-${{ runner.os }}-
        cache-directories: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        cache-on-failure: true
        cache-all-crates: true
        save-if: always
    
    - name: Configure optimized builds
      run: |
        # Configure cargo for maximum performance
        mkdir -p ~/.cargo
        cat > ~/.cargo/config.toml << 'EOF'
        [build]
        rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "target-cpu=native"]
        jobs = 0  # Use all cores
        
        [net]
        retry = 10
        timeout = 60000
        
        [registries.crates-io]
        protocol = "sparse"
        
        [profile.release]
        lto = true
        codegen-units = 1
        panic = "abort"
        EOF
        
        # Remove Cargo.lock for fresh dependency resolution
        rm -f Cargo.lock
    
    - name: Check formatting
      run: cargo +nightly-2025-06-15 fmt --all -- --check
    
    - name: Run clippy
      run: |
        cargo +nightly-2025-06-15 clippy --workspace --lib --bins --tests --jobs $(nproc) -- -W clippy::correctness -W clippy::suspicious -A warnings
    
    - name: Build everything (debug + release + tests)
      run: |
        echo "::group::Building all targets in one comprehensive build"
        
        # 1. Build debug workspace
        echo "Building debug workspace..."
        cargo +nightly-2025-06-15 build --workspace --all-features --jobs $(nproc)
        
        # 2. Build release workspace
        echo "Building release workspace..."
        cargo +nightly-2025-06-15 build --workspace --release --all-features --jobs $(nproc)
        
        # 3. Build all tests (but don't run them yet)
        echo "Building all tests..."
        cargo +nightly-2025-06-15 test --workspace --all-features --no-run --jobs $(nproc)
        
        echo "::endgroup::"
    
    - name: Upload all build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: all-build-artifacts-${{ github.sha }}
        path: |
          target/debug/
          target/release/
          Cargo.lock
        retention-days: 1
        compression-level: 6
    
    outputs:
      artifact-name: all-build-artifacts-${{ github.sha }}

  # Test job that uses pre-built artifacts
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build-all
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH authentication
      uses: ./.github/actions/setup-ssh
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
    
    - name: Setup system dependencies
      uses: ./.github/actions/setup-dependencies
    
    - name: Setup Rust toolchain (minimal for tests)
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly-2025-06-15
    
    - name: Download pre-built artifacts
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build-all.outputs.artifact-name }}
        path: .
    
    - name: Run unit tests
      run: |
        echo "::group::Running unit tests (using pre-built binaries)"
        cargo +nightly-2025-06-15 test --workspace --lib --bins --all-features --jobs $(nproc) -- --test-threads=$(nproc) --nocapture
        echo "::endgroup::"
    
    - name: Run integration tests
      run: |
        echo "::group::Running integration tests"
        timeout 600 cargo +nightly-2025-06-15 test --workspace --test '*' --all-features --jobs $(nproc) -- --test-threads=$(nproc) --nocapture || true
        echo "::endgroup::"
      continue-on-error: true  # Integration tests may require external services
    
    - name: Run doc tests
      run: |
        echo "::group::Running documentation tests"
        cargo +nightly-2025-06-15 test --workspace --doc --all-features --jobs $(nproc)
        echo "::endgroup::"
    
    - name: Generate test report
      if: always()
      run: |
        echo "## Test Summary" > test-report.md
        echo "Generated on: $(date)" >> test-report.md
        echo "" >> test-report.md
        
        # Count test results
        echo "### Test Statistics:" >> test-report.md
        cargo +nightly-2025-06-15 test --workspace --all-features -- --nocapture 2>&1 | tee test-output.log || true
        
        PASSED=$(grep -c "test result: ok" test-output.log || echo "0")
        FAILED=$(grep -c "test result: FAILED" test-output.log || echo "0")
        
        echo "- Tests passed: $PASSED" >> test-report.md
        echo "- Tests failed: $FAILED" >> test-report.md
        
        if [ "$FAILED" -gt "0" ]; then
          echo "" >> test-report.md
          echo "### Failed Tests:" >> test-report.md
          grep -B2 "FAILED" test-output.log >> test-report.md || true
        fi
    
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: test-report.md
        retention-days: 7

  # Security audit using pre-built artifacts
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: build-all
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH authentication
      uses: ./.github/actions/setup-ssh
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
    
    - name: Setup system dependencies
      uses: ./.github/actions/setup-dependencies
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly-2025-06-15
    
    - name: Download pre-built artifacts
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build-all.outputs.artifact-name }}
        path: .
    
    - name: Install cargo-audit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit
    
    - name: Run security audit
      run: |
        # Use the Cargo.lock from the build
        cargo +nightly-2025-06-15 audit --ignore RUSTSEC-0000-0000
      continue-on-error: true  # Don't fail CI on security issues during development

  # Coverage using pre-built artifacts (only on main branch)
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-all
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH authentication
      uses: ./.github/actions/setup-ssh
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
    
    - name: Setup system dependencies
      uses: ./.github/actions/setup-dependencies
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly-2025-06-15
        components: llvm-tools-preview
    
    - name: Download pre-built artifacts
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build-all.outputs.artifact-name }}
        path: .
    
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    
    - name: Generate coverage report
      run: |
        echo "::group::Running tests with coverage"
        cargo +nightly-2025-06-15 llvm-cov --workspace --all-features --lcov --output-path lcov.info
        echo "::endgroup::"
        
        echo "::group::Coverage summary"
        cargo +nightly-2025-06-15 llvm-cov report --summary-only
        echo "::endgroup::"
    
    - name: Generate HTML coverage report
      run: |
        cargo +nightly-2025-06-15 llvm-cov --workspace --all-features --html
        
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: target/llvm-cov/html/
        retention-days: 30
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: lcov.info
        fail_ci_if_error: false
        verbose: true
      continue-on-error: true
  
  # Summary job to check all required jobs passed
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [build-all, test, security-audit]
    if: always()
    
    steps:
    - name: Check job results
      run: |
        if [[ "${{ needs.build-all.result }}" != "success" ]] || \
           [[ "${{ needs.test.result }}" != "success" ]] || \
           [[ "${{ needs.security-audit.result }}" != "success" ]]; then
          echo "One or more required jobs failed"
          exit 1
        fi
        echo "All required CI jobs passed successfully!"