name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Cancel old workflow runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt-and-lint:
    name: Format and Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: fmt-lint
    
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Run clippy
      run: >
        cargo clippy --workspace --lib --bins --tests -- -D warnings
        -A dead_code -A unused_variables -A unused_imports
        -A clippy::derivable_impls -A clippy::field_reassign_with_default
        -A clippy::len_zero -A clippy::needless_borrows_for_generic_args
        -A clippy::single_component_path_imports -A clippy::match_like_matches_macro
        -A clippy::useless_conversion -A clippy::unnecessary_map_or
        -A clippy::large_enum_variant -A clippy::type_complexity
        -A clippy::collapsible_if -A clippy::clone_on_copy -A clippy::redundant_pattern_matching
        -A clippy::useless_format -A clippy::manual_map -A clippy::const_is_empty
        -A clippy::assertions_on_constants -A clippy::ptr_arg -A clippy::needless_borrow
        -A clippy::unwrap_or_default -A clippy::needless_range_loop -A clippy::collapsible_else_if
        -A unused_mut -A clippy::bool_assert_comparison -A clippy::absurd_extreme_comparisons
        -A unused_comparisons -A clippy::redundant_field_names -A clippy::get_first
        -A clippy::redundant_pattern_matching -A clippy::useless_vec -A clippy::manual_range_contains
        -A clippy::if_same_then_else -A clippy::too_many_arguments -A clippy::map_entry
        -A clippy::unnecessary_unwrap -A clippy::or_fun_call -A clippy::vec_init_then_push
        -A clippy::new_without_default -A clippy::op_ref -A clippy::unused_enumerate_index

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: fmt-and-lint
    
    strategy:
      matrix:
        rust: [stable, beta]
        include:
          - rust: nightly
            allow-failure: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    
    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: build-${{ matrix.rust }}
    
    - name: Build workspace
      run: cargo build --workspace --verbose
      continue-on-error: ${{ matrix.allow-failure == true }}
    
    - name: Build examples
      run: cargo build --examples --verbose
      continue-on-error: ${{ matrix.allow-failure == true }}
    
    - name: Run unit tests
      run: cargo test --workspace --verbose --lib --bins
      continue-on-error: ${{ matrix.allow-failure == true }}
    
    - name: Run integration tests
      run: cargo test --workspace --verbose --tests
      continue-on-error: true  # Integration tests may require external services
    
    - name: Check examples compile
      run: cargo check --examples
      continue-on-error: ${{ matrix.allow-failure == true }}

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-audit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit
    
    - name: Run security audit
      run: cargo audit
      continue-on-error: true  # Don't fail CI on security issues during development

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: benchmark
    
    - name: Run benchmarks
      run: |
        if [ -f "benchmarks/benchmark_system.sh" ]; then
          cd benchmarks && ./benchmark_system.sh
        else
          echo "Benchmark script not found, skipping"
        fi
      continue-on-error: true

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview
    
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    
    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: coverage
    
    - name: Generate coverage report
      run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      continue-on-error: true
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: lcov.info
        fail_ci_if_error: false
      continue-on-error: true