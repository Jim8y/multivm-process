# This is an example of how to completely disable artifact uploads
# You can replace the upload steps with conditional logic like this:

# Instead of:
# - name: Upload artifacts
#   uses: actions/upload-artifact@v4
#   with:
#     name: my-artifact
#     path: ./files

# Use this pattern:
# - name: Upload artifacts (disabled due to quota)
#   if: false  # This disables the step completely
#   uses: actions/upload-artifact@v4
#   with:
#     name: my-artifact
#     path: ./files

# Or use environment variables:
# - name: Upload artifacts
#   if: env.ENABLE_ARTIFACTS == 'true'
#   uses: actions/upload-artifact@v4
#   with:
#     name: my-artifact
#     path: ./files