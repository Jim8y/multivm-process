name: Maintenance

on:
  schedule:
    # Run weekly on Sundays at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:  # Allow manual triggering

# Prevent concurrent maintenance runs
concurrency:
  group: maintenance
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Configure Git for private dependencies
      run: |
        # Configure git to use HTTPS with token for all GitHub repositories
        git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
        git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-audit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit
    
    - name: Run comprehensive security audit
      run: |
        echo "## Security Audit Report" >> audit-report.md
        echo "Generated on: $(date)" >> audit-report.md
        echo "" >> audit-report.md
        
        if cargo audit --format json > audit.json; then
          echo "✅ No security vulnerabilities found" >> audit-report.md
        else
          echo "⚠️ Security vulnerabilities detected:" >> audit-report.md
          cargo audit >> audit-report.md
        fi
    
    - name: Check for outdated dependencies
      run: |
        echo "" >> audit-report.md
        echo "## Outdated Dependencies" >> audit-report.md
        cargo tree --outdated --depth 1 >> audit-report.md || echo "No outdated dependencies found" >> audit-report.md
    
    - name: Upload audit report
      uses: actions/upload-artifact@v4
      with:
        name: security-audit-report
        path: audit-report.md
        retention-days: 30

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Configure Git for private dependencies
      run: |
        # Configure git to use HTTPS with token for all GitHub repositories
        git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
        git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-license
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-license
    
    - name: Check licenses
      run: |
        echo "## License Report" > license-report.md
        echo "Generated on: $(date)" >> license-report.md
        echo "" >> license-report.md
        
        echo "### Dependency Licenses:" >> license-report.md
        cargo license --tsv >> license-report.md
        
        echo "" >> license-report.md
        echo "### License Summary:" >> license-report.md
        cargo license | sort | uniq -c | sort -nr >> license-report.md
    
    - name: Upload license report
      uses: actions/upload-artifact@v4
      with:
        name: license-report
        path: license-report.md
        retention-days: 30

  dependency-update-check:
    name: Check for Updates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Configure Git for private dependencies
      run: |
        # Configure git to use HTTPS with token for all GitHub repositories
        git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
        git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-edit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-edit
    
    - name: Check for dependency updates
      run: |
        echo "## Dependency Update Check" > update-report.md
        echo "Generated on: $(date)" >> update-report.md
        echo "" >> update-report.md
        
        echo "### Available Updates:" >> update-report.md
        if cargo upgrade --dry-run > updates.txt 2>&1; then
          if grep -q "Updating" updates.txt; then
            cat updates.txt >> update-report.md
          else
            echo "All dependencies are up to date" >> update-report.md
          fi
        else
          echo "Error checking for updates" >> update-report.md
          cat updates.txt >> update-report.md
        fi
    
    - name: Upload update report
      uses: actions/upload-artifact@v4
      with:
        name: dependency-update-report
        path: update-report.md
        retention-days: 30