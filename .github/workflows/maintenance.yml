name: Maintenance

on:
  # Temporarily disabled due to billing issues
  # schedule:
  #   # Run weekly on Sundays at 02:00 UTC
  #   - cron: '0 2 * * 0'
  workflow_dispatch:  # Allow manual triggering

# Prevent concurrent maintenance runs
concurrency:
  group: maintenance
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: self-hosted
    timeout-minutes: 30
    
    steps:
    - name: Clean workspace (self-hosted runners)
      run: |
        rm -rf target || true
        rm -f ~/.ssh/id_rsa ~/.ssh/id_rsa.pub || true
    
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        clean: true
    
    - name: Setup SSH authentication
      uses: ./.github/actions/setup-ssh
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-audit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit
    
    - name: Run comprehensive security audit
      run: |
        echo "## Security Audit Report" >> audit-report.md
        echo "Generated on: $(date)" >> audit-report.md
        echo "" >> audit-report.md
        
        if cargo audit --format json > audit.json; then
          echo "✅ No security vulnerabilities found" >> audit-report.md
        else
          echo "⚠️ Security vulnerabilities detected:" >> audit-report.md
          cargo audit >> audit-report.md
        fi
    
    - name: Check for outdated dependencies
      run: |
        echo "" >> audit-report.md
        echo "## Outdated Dependencies" >> audit-report.md
        # Install cargo-outdated if not available
        cargo install --quiet cargo-outdated || true
        cargo outdated --depth 1 >> audit-report.md || echo "No outdated dependencies found" >> audit-report.md
    
    - name: Display audit report
      run: |
        echo "Security Audit Report:"
        cat audit-report.md

  license-check:
    name: License Compliance
    runs-on: self-hosted
    timeout-minutes: 30
    
    steps:
    - name: Clean workspace (self-hosted runners)
      run: |
        rm -rf target || true
        rm -f ~/.ssh/id_rsa ~/.ssh/id_rsa.pub || true
    
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        clean: true
    
    - name: Setup SSH authentication
      uses: ./.github/actions/setup-ssh
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-license
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-license
    
    - name: Check licenses
      run: |
        echo "## License Report" > license-report.md
        echo "Generated on: $(date)" >> license-report.md
        echo "" >> license-report.md
        
        echo "### Dependency Licenses:" >> license-report.md
        cargo license --tsv >> license-report.md
        
        echo "" >> license-report.md
        echo "### License Summary:" >> license-report.md
        cargo license | sort | uniq -c | sort -nr >> license-report.md
    
    - name: Display license report
      run: |
        echo "License Report:"
        cat license-report.md

  dependency-update-check:
    name: Check for Updates
    runs-on: self-hosted
    timeout-minutes: 30
    
    steps:
    - name: Clean workspace (self-hosted runners)
      run: |
        rm -rf target || true
        rm -f ~/.ssh/id_rsa ~/.ssh/id_rsa.pub || true
    
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        clean: true
    
    - name: Setup SSH authentication
      uses: ./.github/actions/setup-ssh
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
    
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install cargo-edit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-edit
    
    - name: Check for dependency updates
      run: |
        echo "## Dependency Update Check" > update-report.md
        echo "Generated on: $(date)" >> update-report.md
        echo "" >> update-report.md
        
        echo "### Available Updates:" >> update-report.md
        if cargo upgrade --dry-run > updates.txt 2>&1; then
          if grep -q "Updating" updates.txt; then
            cat updates.txt >> update-report.md
          else
            echo "All dependencies are up to date" >> update-report.md
          fi
        else
          echo "Error checking for updates" >> update-report.md
          cat updates.txt >> update-report.md
        fi
    
    - name: Display update report
      run: |
        echo "Dependency Update Report:"
        cat update-report.md