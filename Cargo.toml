[workspace]
members = [
    "multivm-common",
    "multivm-account-mapping",
    "multivm-mock-processes",
    "multivm-p2p",
    "multivm-process-manager", 
    "multivm-application",
    "multivm-consensus",
    "multivm-cli",
    # Re-enabling execution engines with feature-based compilation
    "reth-execution-engine",
    "solana-execution-engine",  # ed25519-dalek conflict resolved
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Multiverse Virtual Machine Contributors"]
license = "Apache-2.0"
repository = "https://github.com/multiverse-vm/multivm"
rust-version = "1.70"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Networking
reqwest = { version = "0.11", features = ["json", "stream"] }
libp2p = { version = "0.53", features = ["gossipsub", "mdns", "noise", "tcp", "yamux", "identify", "kad", "ping", "request-response", "websocket", "serde", "macros", "tokio", "dns"] }
tokio-tungstenite = "0.20"

# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "timeout"] }
warp = "0.3"

# GraphQL
async-graphql = { version = "7.0", features = ["chrono", "uuid"] }
async-graphql-axum = "7.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
rocksdb = "0.22"

# Caching
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Cryptography
hex = "0.4"
sha2 = "0.10"
rand = "0.8"
# Updated to ed25519-dalek v2.0 for modern API compatibility
ed25519-dalek = { version = "2.0", features = ["rand_core"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Metrics and monitoring
prometheus = "0.13"
opentelemetry = "0.21"

# Blockchain specific
ethers = "2.0"
alloy-primitives = "0.7"
# Use specific version of solana-sdk with zeroize < 1.4
solana-sdk = "1.14.29"
solana-client = "1.14.29"
solana-program = "1.14.29"
solana-transaction-status = "1.14.29"

# Process management
nix = { version = "0.28", features = ["process", "signal"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Command line
clap = { version = "4.4", features = ["derive", "env"] }
dialoguer = "0.11"

# Testing
mockall = "0.12"
tempfile = "3.8"
wiremock = "0.5"
proptest = "1.4"

# Internal crates
multivm-common = { path = "multivm-common" }
multivm-account-mapping = { path = "multivm-account-mapping" }
multivm-p2p = { path = "multivm-p2p" }
multivm-consensus = { path = "multivm-consensus" }
multivm-process-manager = { path = "multivm-process-manager" }
multivm-application = { path = "multivm-application" }
multivm-mock-processes = { path = "multivm-mock-processes" }
multivm-cli = { path = "multivm-cli" }
reth-execution-engine = { path = "reth-execution-engine" }
solana-execution-engine = { path = "solana-execution-engine" }

# Additional dependencies needed for various features
jsonrpsee-types = "0.21"
http = "1.0"
hyper = "1.1"
tonic = "0.10"
prost = "0.12"
bytes = "1.5"

# Cryptography and hashing
blake3 = "1.5"
bs58 = "0.5"
sha3 = "0.10"
secp256k1 = "0.28"
chacha20poly1305 = "0.8"
hmac = "0.12"

# System utilities
sysinfo = "0.30"
base64 = "0.22"
once_cell = "1.19"
parking_lot = "0.12"
governor = "0.6"
nonzero_ext = "0.3"
config = "0.14"
dashmap = "5.5"

# JSON-RPC
jsonrpc-core = "18.0"
jsonrpc-http-server = "18.0"
jsonrpsee = "0.21"

# JWT and authentication
jsonwebtoken = "9.2"
bcrypt = "0.15"

# Benchmarking
criterion = "0.5"

# Malachite BFT consensus - temporarily commented out due to dependency conflicts
# informalsystems-malachitebft-app-channel = "0.1"
# informalsystems-malachitebft-codec = "0.1"
# informalsystems-malachitebft-config = "0.1"
# informalsystems-malachitebft-core-consensus = "0.1"
# informalsystems-malachitebft-core-types = "0.1"
# informalsystems-malachitebft-engine = "0.1"
# informalsystems-malachitebft-proto = "0.1"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.test]
opt-level = 1
debug = true
