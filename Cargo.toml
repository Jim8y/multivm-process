[workspace]
resolver = "2"
members = [
    "core",
    "network", 
    "storage",
    "consensus",
    "vm-runtime",
    "rpc",
    "orchestrator"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MultiVM Process Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/multivm/multivm-process"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
prost = "0.13"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Data structures
bytes = "1.7"
rand = "0.8"
crossbeam-channel = "0.5"
parking_lot = "0.12"
dashmap = "6.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Network
tokio-util = { version = "0.7", features = ["codec"] }
rustls = "0.23"
tokio-rustls = "0.26"
quinn = "0.11"

# Storage
rocksdb = { version = "0.22", default-features = false, features = ["multi-threaded-cf"] }
sled = "0.34"

# RPC
tonic = "0.12"
prost-types = "0.13"
tower = "0.5"
hyper = "1.0"
axum = "0.7"

# Metrics
prometheus = "0.13"
opentelemetry = "0.27"
opentelemetry-otlp = "0.27"

# Testing
proptest = "1.5"
criterion = "0.5"
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
rcgen = "0.13"
sysinfo = "0.32"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
