[workspace]
members = [
    "multivm-common",
    "multivm-account-mapping",
    "multivm-mock-processes",
    "multivm-p2p",
    "multivm-process-manager", 
    "multivm-application",
    "multivm-consensus",
    "multivm-cli",
    "reth-execution-engine",
    # "solana-execution-engine",  # Temporarily excluded due to dependency conflicts
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Multiverse Virtual Machine Contributors"]
license = "Apache-2.0"
repository = "https://github.com/multiverse-vm/multivm"
rust-version = "1.70"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "fs", "net", "time", "sync", "signal", "process", "io-util"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Networking
reqwest = { version = "0.11", features = ["json", "stream"] }
libp2p = { version = "0.54", features = ["gossipsub", "mdns", "noise", "tcp", "yamux", "identify", "kad", "ping", "websocket", "serde", "macros", "tokio", "dns"] }
tokio-tungstenite = "0.20"

# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "timeout"] }
# Removed warp - use axum exclusively

# GraphQL
async-graphql = { version = "7.0", features = ["chrono", "uuid"] }
async-graphql-axum = "7.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
rocksdb = "0.21"

# Caching
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Cryptography
hex = "0.4"
sha2 = "0.10"
rand = "0.8"
# Updated to ed25519-dalek v2.0 for modern API compatibility
ed25519-dalek = { version = "2.0", features = ["rand_core"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Metrics and monitoring
prometheus = "0.13"

# Ethereum support - minimal dependencies only
# ethers removed - not used in codebase
alloy-primitives = "0.7"
alloy-consensus = "0.1"
alloy-rlp = "0.3"
revm = "12.1"

# Solana support - using crates.io versions for stability
# All Solana dependencies use compatible versions to avoid conflicts
# solana-sdk = "1.18"
# solana-client = "1.18"
# solana-transaction-status = "1.18"
# agave-validator = "1.18"

# Process management
nix = { version = "0.28", features = ["process", "signal"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Command line
clap = { version = "4.4", features = ["derive", "env"] }

# Testing
tempfile = "3.8"
proptest = "1.4"

# Internal crates
multivm-common = { path = "multivm-common" }
multivm-account-mapping = { path = "multivm-account-mapping" }
multivm-p2p = { path = "multivm-p2p" }
multivm-consensus = { path = "multivm-consensus" }
multivm-process-manager = { path = "multivm-process-manager" }
multivm-application = { path = "multivm-application" }
multivm-mock-processes = { path = "multivm-mock-processes" }
multivm-cli = { path = "multivm-cli" }
reth-execution-engine = { path = "reth-execution-engine" }
# solana-execution-engine = { path = "solana-execution-engine" }

# Private repository dependencies (examples - uncomment and modify as needed)
# multivm-shared-utils = { git = "https://github.com/your-org/multivm-shared-utils.git", tag = "v1.0.0" }
# multivm-crypto-lib = { git = "https://github.com/your-org/multivm-crypto.git", branch = "main" }
# experimental-features = { git = "https://github.com/your-org/experimental.git", rev = "abc123" }

# Additional dependencies needed for various features
jsonrpsee-types = "0.21"
http = "1.0"
hyper = "1.1"
# tonic = "0.10"  # Removed - not used in codebase
prost = "0.12"
bytes = "1.5"

# Cryptography and hashing
blake3 = "1.5"
bs58 = "0.5"
sha3 = "0.10"
secp256k1 = { version = "0.28", features = ["recovery", "rand-std"] }
chacha20poly1305 = "0.10"
hmac = "0.12"

# System utilities
sysinfo = "0.30"
base64 = "0.22"
once_cell = "1.19"
parking_lot = "0.12"
governor = "0.6"
nonzero_ext = "0.3"
config = "0.14"
dashmap = "5.5"

# JSON-RPC
jsonrpsee = "0.21"
# Legacy JSON-RPC needed by reth-execution-engine
jsonrpc-core = "18.0"
jsonrpc-http-server = "18.0"

# JWT and authentication
jsonwebtoken = "9.3"

# Benchmarking
criterion = "0.5"

# Malachite BFT consensus from Informal Systems - Released versions from crates.io
informalsystems-malachitebft-app-channel = "0.3.0"
informalsystems-malachitebft-codec = "0.3.0"
informalsystems-malachitebft-config = "0.3.0"
informalsystems-malachitebft-core-consensus = "0.3.0"
informalsystems-malachitebft-core-types = "0.3.0"
informalsystems-malachitebft-engine = "0.3.0"
informalsystems-malachitebft-proto = "0.3.0"


[profile.release]
opt-level = 3

# Override for solana-execution-engine to prevent stack overflow
[profile.release.package.solana-execution-engine]
opt-level = 2
codegen-units = 16

# Also override agave-validator 
[profile.release.package.agave-validator]
opt-level = 2
codegen-units = 16

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.test]
opt-level = 1
debug = true