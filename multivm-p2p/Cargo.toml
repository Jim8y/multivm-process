[package]
name = "multivm-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "P2P networking service for the MultiVM platform"

[dependencies]
# Internal dependencies
multivm-common = { workspace = true }

# Core async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Networking
libp2p = { workspace = true }
tokio-tungstenite = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
base64 = { workspace = true }

# Error handling and logging
thiserror = { workspace = true }
tracing = { workspace = true }

# Cryptography
hex = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = "2.0"
curve25519-dalek = "4.1"
anyhow = { workspace = true }
chacha20poly1305 = { workspace = true }
jsonwebtoken = { workspace = true }

# Rate limiting
governor = { workspace = true }
nonzero_ext = { workspace = true }

# Internal dependencies
multivm-account-mapping = { workspace = true }

# Time and UUID
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

# Concurrency utilities
parking_lot = { workspace = true }

# Optional metrics dependencies
once_cell = { workspace = true, optional = true }
prometheus = { version = "0.13", optional = true }
reqwest = { version = "0.11", optional = true }

# Optional tracing dependency
tracing-subscriber = { workspace = true, optional = true }

# System monitoring
sysinfo = { workspace = true }

# Persistent storage
rocksdb = { workspace = true, optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = { workspace = true }
proptest = { workspace = true }
tracing-subscriber = { workspace = true }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[features]
default = []
testing = []
metrics = ["once_cell", "prometheus", "reqwest"]
persistence = ["rocksdb"]
tracing-subscriber = ["dep:tracing-subscriber"]

[[bench]]
name = "p2p_benchmarks"
harness = false
