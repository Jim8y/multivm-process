[package]
name = "multivm-p2p"
version.workspace = true
authors = ["MultiVM Contributors"]
edition.workspace = true
license.workspace = true
description = "P2P networking layer for MultiVM unified network interface"

[dependencies]
# Workspace dependencies
multivm-common = { path = "../multivm-common" }
multivm-account-mapping = { path = "../multivm-account-mapping" }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# Networking - libp2p for production P2P networking
libp2p = { version = "0.54", features = [
    "kad",
    "gossipsub", 
    "mdns",
    "tcp",
    "noise",
    "yamux",
    "identify",
    "autonat",
    "relay",
    "dcutr",
    "ping",
    "request-response",
    "metrics",
    "serde",
    "macros",
    "tokio"
]}
multiaddr = "0.18"
libp2p-swarm = "0.45"
libp2p-core = "0.42"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Cryptography
sha2 = { workspace = true }
rand = { workspace = true }
rand_chacha = "0.3"
ed25519-dalek.workspace = true
x25519-dalek = "2.0"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"

# Rate limiting
governor.workspace = true
nonzero_ext.workspace = true

# Time and utilities
chrono = { workspace = true }
uuid = { workspace = true }

# Additional networking utilities
bytes = "1.0"
hex.workspace = true

# Metrics (optional)
prometheus = { version = "0.13", optional = true }
lazy_static = { version = "1.4", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-test = "0.4"
tracing-subscriber = "0.3"
env_logger = "0.10"

[features]
default = []
metrics = ["prometheus", "lazy_static"]

[[example]]
name = "basic_p2p_usage"
required-features = []

[[example]]
name = "advanced_routing"
required-features = []
