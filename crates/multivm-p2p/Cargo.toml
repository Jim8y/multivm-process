[package]
name = "multivm-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "P2P networking service for the MultiVM platform"

[dependencies]
# Internal dependencies
multivm-common = { path = "../multivm-common" }

# Core async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Networking
libp2p = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Error handling and logging
thiserror = { workspace = true }
tracing = { workspace = true }

# Cryptography
hex = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = "2.0"
rand_chacha = "0.3"
anyhow = { workspace = true }
# chacha20poly1305 = "0.10"  # Temporarily commented to resolve zeroize conflict

# Rate limiting
governor = { workspace = true }
nonzero_ext = { workspace = true }

# Internal dependencies
multivm-account-mapping = { path = "../multivm-account-mapping" }

# Time and UUID
chrono = { workspace = true }
uuid = { workspace = true }

# Concurrency utilities
parking_lot = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = { workspace = true }
proptest = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
testing = []
