[package]
name = "multivm-application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Main application for the MultiVM platform"

[dependencies]
# Internal dependencies
multivm-common = { path = "../multivm-common" }
multivm-account-mapping = { path = "../multivm-account-mapping" }
# multivm-consensus = { path = "../multivm-consensus" }  # Temporarily disabled due to malachite
multivm-p2p = { path = "../multivm-p2p" }
multivm-process-manager = { path = "../multivm-process-manager" }

# Core async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }

# GraphQL
async-graphql = { workspace = true }
async-graphql-axum = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling and logging
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Configuration
config = { workspace = true }

# Time and UUID
chrono = { workspace = true }
uuid = { workspace = true }

# Concurrency utilities
parking_lot = { workspace = true }

# Additional dependencies
bincode = { workspace = true }
hex = { workspace = true }
warp = { workspace = true }
rand = { workspace = true }
prometheus = { workspace = true }
redis = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
futures-util = { workspace = true }
jsonwebtoken = { workspace = true }
dashmap = { workspace = true }
async-stream = { workspace = true }
tokio-tungstenite = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = { workspace = true }
proptest = { workspace = true }

[features]
default = []
testing = []
