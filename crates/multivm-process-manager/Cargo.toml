[package]
name = "multivm-process-manager"
version.workspace = true
authors = ["MultiVM Contributors"]
edition.workspace = true
license.workspace = true
description = "Process manager for multi-VM blockchain execution engines"

[dependencies]
# Common types and traits
multivm-common = { path = "../multivm-common" }
multivm-consensus = { path = "../multivm-consensus" }
multivm-account-mapping = { path = "../multivm-account-mapping" }
blake3 = { workspace = true }

# Core dependencies
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Process management
which = "4.4"
sysinfo = "0.29"

# Time handling
chrono = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
bs58 = { workspace = true }

# HTTP client for health checks
reqwest = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-test = "0.4" 