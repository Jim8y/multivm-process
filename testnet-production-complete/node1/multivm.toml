[system]
data_dir = "/data"
log_level = "info"

[server]
[server.rest]
host = "0.0.0.0"
port = 8080
enable_cors = true
request_timeout_seconds = 30
max_request_size_bytes = 1048576

[server.graphql]
host = "0.0.0.0"
port = 8081
enable_playground = true
request_timeout_seconds = 30

[server.websocket]
host = "0.0.0.0"
port = 8082
max_connections = 1000
heartbeat_interval_seconds = 30

[consensus]
algorithm = "malachite"
[consensus.malachite]
node_id = "9015af1691d635fa2dc420cd9c32d62c572114b5"
private_key_path = "/data/keys/validator.pem"
genesis_path = "/data/genesis.json"

[consensus.malachite.network]
listen_address = "0.0.0.0:26656"
peers = []
max_peers = 50
connection_timeout_seconds = 10

[consensus.malachite.timeouts]
propose_timeout_ms = 3000
prevote_timeout_ms = 1000
precommit_timeout_ms = 1000
commit_timeout_ms = 1000

[p2p]
node_id = "9015af1691d635fa2dc420cd9c32d62c572114b5"
listen_address = "0.0.0.0:26656"
external_address = "node1:26656"

[execution_engines]
[execution_engines.ethereum]
engine_type = "reth"
data_dir = "/data/ethereum"
rpc_port = 8545
chain_id = 1337
mock_mode = false
auto_start = true

[execution_engines.solana]
engine_type = "mock"
data_dir = "/data/solana"
rpc_port = 8899
cluster = "localnet"
mock_mode = true
auto_start = true

[storage]
backend = "rocksdb"
path = "/data/storage"

[telemetry]
enabled = true
endpoint = "0.0.0.0:9090"
