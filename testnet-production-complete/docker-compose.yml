# MultiVM Production Testnet - Complete Account System
# 7 validators with proper Ethereum + Ed25519 + MultiVM account logic

services:
  # ===== NODE 1 =====
  reth-node1:
    image: ghcr.io/paradigmxyz/reth:latest
    container_name: reth-node1
    hostname: reth-node1
    networks:
      - multivm-net
    ports:
      - "8545:8545"
      - "8551:8551"
    volumes:
      - ./node1/jwt.hex:/jwt.hex:ro
      - ./node1/reth:/data
      - ./node1/logs/reth:/logs
    environment:
      - RUST_LOG=info
    command: |
      node
      --chain dev
      --datadir /data
      --log.file.directory /logs
      --http --http.addr 0.0.0.0 --http.port 8545
      --http.api eth,net,web3,debug,trace,txpool,admin,miner
      --http.corsdomain "*"
      --ws --ws.addr 0.0.0.0 --ws.port 8546
      --ws.api eth,net,web3,debug,trace,txpool,admin,miner
      --ws.origins "*"
      --authrpc.addr 0.0.0.0 --authrpc.port 8551
      --authrpc.jwtsecret /jwt.hex
      --metrics 0.0.0.0:9091
      --dev --dev.block-time 12s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 5

  multivm-node1:
    image: multivm-testnet:latest
    container_name: multivm-node1
    hostname: multivm-node1
    networks:
      - multivm-net
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
      - "26656:26656"
      - "9090:9090"
    volumes:
      - ./node1/multivm.toml:/data/config/multivm.toml:ro
      - ./node1/genesis.json:/data/genesis.json:ro
      - ./node1/keys:/data/keys:ro
      - ./node1/jwt.hex:/data/jwt.hex:ro
      - ./node1/multivm:/data/multivm
      - ./node1/logs/multivm:/data/logs
    environment:
      - MULTIVM_CONFIG_FILE=/data/config/multivm.toml
      - MULTIVM_ETHEREUM_MOCK_MODE=false
      - MULTIVM_ENGINE_API_URL=http://reth-node1:8551
      - MULTIVM_JWT_SECRET_PATH=/data/jwt.hex
      - MULTIVM_ETHEREUM_PRIVATE_KEY_PATH=/data/keys/eth_private.key
      - RUST_LOG=info,multivm=debug
      - RUST_BACKTRACE=1
    command: ["--config", "/data/config/multivm.toml"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

