[package]
name = "multivm-consensus"
version = "0.1.0"
authors = ["MultiVM Contributors"]
description = "Malachite consensus integration for MultiVM"
edition = "2021"
license = "MIT"

# Removed workspace section to allow inheritance from root

[dependencies]
multivm-common = { workspace = true }
multivm-p2p = { workspace = true }

# Core dependencies
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
bincode = "1.3"
tracing = "0.1"
thiserror = "1.0"
rand = "0.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
parking_lot = "0.12"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
bs58 = "0.5"
rocksdb = "0.21"

# Consensus specific
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1.5"
hex = "0.4"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }

# Malachite consensus engine - temporarily commented out due to dependency conflicts
# informalsystems-malachitebft-engine = { workspace = true }
# informalsystems-malachitebft-core-consensus = { workspace = true }
# informalsystems-malachitebft-core-types = { workspace = true }
# informalsystems-malachitebft-proto = { workspace = true }
# informalsystems-malachitebft-app-channel = { workspace = true }
# informalsystems-malachitebft-codec = { workspace = true }
# informalsystems-malachitebft-config = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
criterion = "0.5"
rand = "0.8"
tracing-subscriber = "0.3"

