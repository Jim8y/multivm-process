[package]
name = "multivm-consensus"
version = "0.1.0"
authors = ["MultiVM Contributors"]
description = "Malachite consensus integration for MultiVM"
edition = "2021"
license = "MIT"

# Removed workspace section to allow inheritance from root

[dependencies]
multivm-common = { workspace = true }
multivm-p2p = { workspace = true }
multivm-account-mapping = { workspace = true }

# Core dependencies
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
bs58 = { workspace = true }
rocksdb = { workspace = true }

# Consensus specific
sha2 = { workspace = true }
sha3 = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }

# Malachite consensus engine from Informal Systems
informalsystems-malachitebft-engine = { workspace = true }
informalsystems-malachitebft-core-consensus = { workspace = true }
informalsystems-malachitebft-core-types = { workspace = true }
informalsystems-malachitebft-proto = { workspace = true }
informalsystems-malachitebft-app-channel = { workspace = true }
informalsystems-malachitebft-codec = { workspace = true }
informalsystems-malachitebft-config = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
criterion = "0.5"
rand = "0.8"
tracing-subscriber = "0.3"

