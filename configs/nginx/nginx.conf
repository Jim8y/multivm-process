user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=rpc_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # Load balancing for RPC endpoints
    upstream multivm_rpc {
        least_conn;
        server multivm-node1:8000 max_fails=3 fail_timeout=30s;
        server multivm-node2:8001 max_fails=3 fail_timeout=30s;
        server multivm-node3:8002 max_fails=3 fail_timeout=30s;
    }

    # Load balancing for Ethereum RPC
    upstream ethereum_rpc {
        least_conn;
        server multivm-node1:8545;
        server multivm-node2:8545;
        server multivm-node3:8545;
    }

    # Load balancing for Solana RPC
    upstream solana_rpc {
        least_conn;
        server multivm-node1:8899;
        server multivm-node2:8899;
        server multivm-node3:8899;
    }

    # Main HTTPS server
    server {
        listen 443 ssl http2;
        server_name multivm.example.com;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # MultiVM RPC endpoint
        location /rpc {
            limit_req zone=rpc_limit burst=50 nodelay;
            
            proxy_pass http://multivm_rpc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Ethereum RPC endpoint
        location /eth {
            limit_req zone=rpc_limit burst=30 nodelay;
            
            proxy_pass http://ethereum_rpc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Solana RPC endpoint
        location /sol {
            limit_req zone=rpc_limit burst=30 nodelay;
            
            proxy_pass http://solana_rpc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Metrics endpoint (internal only)
        location /metrics {
            allow 172.20.0.0/16;
            deny all;
            proxy_pass http://multivm_rpc/metrics;
        }
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name multivm.example.com;
        return 301 https://$server_name$request_uri;
    }
}