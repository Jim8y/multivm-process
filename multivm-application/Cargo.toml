[package]
name = "multivm-application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Application Layer (Layer 6) for MultiVM blockchain - REST API, GraphQL, WebSocket, and Admin interfaces"

[dependencies]
# Workspace dependencies
multivm-common = { path = "../multivm-common" }
multivm-consensus = { path = "../multivm-consensus" }
multivm-account-mapping = { path = "../multivm-account-mapping" }
multivm-process-manager = { path = "../multivm-process-manager" }
multivm-p2p = { path = "../multivm-p2p" }

# Core async runtime and utilities
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
humantime-serde = "1.1"

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }
eyre = { workspace = true }

# Logging and tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# HTTP server framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }

# JSON-RPC support
jsonrpsee = { workspace = true }

# GraphQL
async-graphql = { workspace = true }
async-graphql-axum = { workspace = true }

# WebSocket
tokio-tungstenite = { workspace = true }

# Authentication and security
jsonwebtoken = { workspace = true, optional = true }
uuid = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }

# Database and caching
# Database support removed for now
redis = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }

# Configuration
config = { workspace = true }
toml = { workspace = true }

# Time handling
chrono = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Rate limiting
governor = "0.6"
nonzero_ext = "0.3"

# Metrics and monitoring
prometheus = { version = "0.13", optional = true }
metrics = { version = "0.22", optional = true }
metrics-prometheus = { version = "0.6", optional = true }
warp = { version = "0.3", optional = true }
opentelemetry = { version = "0.20", optional = true }
opentelemetry-jaeger = { version = "0.19", optional = true }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Additional utilities
hex = { workspace = true }
# Concurrency utilities removed for simplicity
parking_lot = "0.12"
once_cell = "1.19"

# Solana client dependencies
solana-client = { workspace = true }
solana-sdk = { workspace = true }
solana-transaction-status = { workspace = true }

# Ethereum/Reth client dependencies (commented out to avoid conflicts)
# alloy-primitives = { workspace = true }
# alloy-consensus = { workspace = true }

# Random number generation
rand = { workspace = true }

# Bincode for serialization
bincode = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }
tokio-test = "0.4"
wiremock = "0.5"
testcontainers = "0.15"

[[bin]]
name = "multivm-application"
path = "src/main.rs"

[features]
default = ["auth", "cache", "monitoring"]
metrics = ["dep:prometheus", "dep:metrics", "dep:metrics-prometheus"]
monitoring = ["dep:warp", "dep:opentelemetry", "dep:opentelemetry-jaeger"]
auth = ["dep:jsonwebtoken"]
cache = ["dep:redis", "dep:dashmap"]
admin-ui = []
development = [] 