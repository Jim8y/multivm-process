version: '3.8'

services:
  # Node 1 - Bootstrap node with block generation
  multivm-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multivm-node-1
    hostname: multivm-node-1
    environment:
      - NODE_ID=node-1
      - NODE_TYPE=bootstrap
      - P2P_LISTEN_ADDR=0.0.0.0:26656
      - API_LISTEN_ADDR=0.0.0.0:8080
      - CONSENSUS_ROLE=validator
      - LOG_LEVEL=info
      - BOOTSTRAP_NODES=
      - VALIDATOR_KEY=validator-1-key
      - BLOCK_GENERATION_ENABLED=true
      - BLOCK_INTERVAL_MS=2000
      - SVM_TX_PER_BLOCK=3
      - EVM_TX_PER_BLOCK=3
      - RUST_LOG=info,multivm=debug,multivm_consensus=debug,multivm_process_manager=debug
    ports:
      - "8080:8080"
      - "26656:26656"
      - "8545:8545"
      - "8899:8899"
    volumes:
      - multivm-node-1-data:/opt/multivm/data
      - ./logs:/opt/multivm/logs
    networks:
      multivm-net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Node 2 - Validator node
  multivm-node-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multivm-node-2
    hostname: multivm-node-2
    environment:
      - NODE_ID=node-2
      - NODE_TYPE=validator
      - P2P_LISTEN_ADDR=0.0.0.0:26656
      - API_LISTEN_ADDR=0.0.0.0:8080
      - CONSENSUS_ROLE=validator
      - LOG_LEVEL=info
      - BOOTSTRAP_NODES=multivm-node-1:26656
      - VALIDATOR_KEY=validator-2-key
      - BLOCK_GENERATION_ENABLED=false
      - RUST_LOG=info,multivm=debug,multivm_consensus=debug
    ports:
      - "8081:8080"
      - "26657:26656"
      - "8546:8545"
      - "8900:8899"
    volumes:
      - multivm-node-2-data:/opt/multivm/data
      - ./logs:/opt/multivm/logs
    networks:
      multivm-net:
        ipv4_address: 172.20.0.11
    depends_on:
      multivm-node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Node 3 - Validator node
  multivm-node-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multivm-node-3
    hostname: multivm-node-3
    environment:
      - NODE_ID=node-3
      - NODE_TYPE=validator
      - P2P_LISTEN_ADDR=0.0.0.0:26656
      - API_LISTEN_ADDR=0.0.0.0:8080
      - CONSENSUS_ROLE=validator
      - LOG_LEVEL=info
      - BOOTSTRAP_NODES=multivm-node-1:26656,multivm-node-2:26656
      - VALIDATOR_KEY=validator-3-key
      - BLOCK_GENERATION_ENABLED=false
      - RUST_LOG=info,multivm=debug,multivm_consensus=debug
    ports:
      - "8082:8080"
      - "26658:26656"
      - "8547:8545"
      - "8901:8899"
    volumes:
      - multivm-node-3-data:/opt/multivm/data
      - ./logs:/opt/multivm/logs
    networks:
      multivm-net:
        ipv4_address: 172.20.0.12
    depends_on:
      multivm-node-1:
        condition: service_healthy
      multivm-node-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Status monitor - Shows real-time network status
  status-monitor:
    image: alpine:latest
    container_name: multivm-status-monitor
    networks:
      - multivm-net
    depends_on:
      - multivm-node-1
      - multivm-node-2
      - multivm-node-3
    command: >
      sh -c "
        apk add --no-cache curl jq &&
        echo '🔍 MultiVM Network Status Monitor Started' &&
        echo '========================================' &&
        while true; do
          echo -e '\n📊 Network Status at '`date '+%Y-%m-%d %H:%M:%S'`':' &&
          echo '----------------------------------------' &&
          
          for i in 1 2 3; do
            NODE_URL=\"http://multivm-node-$$i:8080\"
            echo -n \"Node $$i: \"
            
            if curl -sf $$NODE_URL/health > /dev/null 2>&1; then
              echo -n '✅ Healthy'
              
              # Try to get block height (mock endpoint)
              HEIGHT=$$(curl -sf $$NODE_URL/api/v1/status 2>/dev/null | jq -r '.block_height // \"unknown\"' 2>/dev/null || echo 'unknown')
              if [ \"$$HEIGHT\" != \"unknown\" ]; then
                echo -n \" | Block Height: $$HEIGHT\"
              fi
              
              # Try to get peer count
              PEERS=$$(curl -sf $$NODE_URL/api/v1/peers 2>/dev/null | jq -r '.count // \"unknown\"' 2>/dev/null || echo 'unknown')
              if [ \"$$PEERS\" != \"unknown\" ]; then
                echo -n \" | Peers: $$PEERS\"
              fi
              echo
            else
              echo '❌ Unhealthy or Starting...'
            fi
          done
          
          echo '----------------------------------------'
          
          # Show block generation status
          if curl -sf http://multivm-node-1:8080/health > /dev/null 2>&1; then
            echo '⚡ Block Generation: Active (Node 1)'
            echo '🔄 Block Interval: 2000ms'
            echo '📦 Transactions per block: 3 SVM + 3 EVM'
          fi
          
          sleep 5
        done
      "

  # Log aggregator - Shows combined logs from all nodes
  log-aggregator:
    image: alpine:latest
    container_name: multivm-log-aggregator
    volumes:
      - ./logs:/logs:ro
    networks:
      - multivm-net
    command: >
      sh -c "
        echo '📝 MultiVM Log Aggregator Started' &&
        echo '=================================' &&
        echo 'Showing logs from all nodes...' &&
        echo '' &&
        
        # Color codes for different nodes
        while true; do
          if ls /logs/*.log >/dev/null 2>&1; then
            tail -f /logs/*.log 2>/dev/null | 
            while IFS= read -r line; do
              if echo \"$$line\" | grep -q 'node-1'; then
                echo -e '\033[0;32m[Node-1]\033[0m' \"$$line\"
              elif echo \"$$line\" | grep -q 'node-2'; then
                echo -e '\033[0;34m[Node-2]\033[0m' \"$$line\"
              elif echo \"$$line\" | grep -q 'node-3'; then
                echo -e '\033[0;35m[Node-3]\033[0m' \"$$line\"
              else
                echo \"$$line\"
              fi
            done
          else
            echo 'Waiting for log files...'
            sleep 5
          fi
        done
      "

networks:
  multivm-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

volumes:
  multivm-node-1-data:
  multivm-node-2-data:
  multivm-node-3-data: